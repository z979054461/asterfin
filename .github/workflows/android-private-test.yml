\'run_attempt\\'] == attempt\\n            and receipt.get(\\'workflow_sha\\') == os.environ[\\'GITHUB_SHA\\']\\n            and receipt.get(\\'workflow_path\\') == \\'.github/workflows/android-private-test.yml\\'\\n            and receipt.get(\\'head_branch\\') == \\'mobile-dev\\' and receipt.get(\\'role\\') == \\'fetch-unsigned\\'\\n            and receipt.get(\\'job_name\\') == \\'Build reviewed source without signing keys\\'\\n            and receipt.get(\\'job_id\\') == receipt.get(\\'source_build_job_id\\')\\n            and receipt.get(\\'member_name\\') == \\'transfer.cms\\'\\n            and receipt.get(\\'artifact_name\\') == f\\'unsigned-transfer-{run_id}-{attempt}\\')\\n    require(type(receipt.get(\\'artifact_id\\')) is int and receipt[\\'artifact_id\\'] > 0)\\n    require(isinstance(receipt.get(\\'artifact_digest\\'), str)\\n            and re.fullmatch(r\\'sha256:[0-9a-f]{64}\\', receipt[\\'artifact_digest\\']) is not None)\\n    # Keep and recheck the archive authenticated by the Actions API before parsing.\\n    archive = root/\\'unsigned-artifact/artifact.zip\\'\\n    regular(archive, 513*1024**2)\\n    require(digest(archive) == receipt[\\'artifact_digest\\'][7:])\\n    decoded = root/\\'received\\'\\n    decrypt(root/\\'unsigned-artifact/transfer.cms\\', root/\\'one-run-recipient\\', decoded,\\n            expected_ciphertext_sha256=receipt[\\'member_sha256\\'], run_id=run_id,\\n            run_attempt=attempt, source=SOURCE_SHA, version=VERSION_CODE)\\n    facts_path = decoded/\\'host-facts.json\\'; regular(facts_path, 16384)\\n    transport = json.loads(facts_path.read_text())\\n    require(transport.get(\\'transport_authenticated\\') is True)\\n    apk = decoded/\\'unsigned.apk\\'; regular(apk, 512*1024**2)\\n    require(digest(apk) == transport[\\'unsigned_sha256\\'])\\n    facts = {\\'source_commit\\': SOURCE_SHA, \\'version_code\\': VERSION_CODE,\\n             \\'unsigned_sha256\\': transport[\\'unsigned_sha256\\'],\\n             \\'build_isolation\\': \\'separate-github-hosted-job\\', \\'provenance_verified\\': True,\\n             \\'run_id\\': run_id, \\'run_attempt\\': attempt, \\'workflow_sha\\': receipt[\\'workflow_sha\\'],\\n             \\'source_build_job_id\\': receipt[\\'source_build_job_id\\'], \\'signing_job_id\\': receipt[\\'signing_job_id\\'],\\n             \\'artifact_id\\': receipt[\\'artifact_id\\'], \\'artifact_archive_sha256\\': receipt[\\'artifact_digest\\'][7:]}\\n    validate_provenance(facts)\\n    require(not (root/\\'unsigned.apk\\').exists() and not (root/\\'host-facts.json\\').exists())\\n    os.link(apk, root/\\'unsigned.apk\\')\\n    with open(root/\\'host-facts.json\\', \\'x\\') as out: json.dump(facts, out, sort_keys=True)\\n    # The per-run transport private key is no longer needed before signing Secrets.\\n    cleanup_recipient(root/\\'one-run-recipient\\', run_id, attempt)\\n    require(not (root/\\'one-run-recipient\\').exists())\\n    print(\\'PASS: separate build input authenticated; independent APK checks next\\', flush=True)\\n\\n\\nif __name__ == \\'__main__\\':\\n    try: prepare(Path(__file__).resolve().parent)\\n    except BaseException: raise SystemExit(\\'Separate signer input verification failed; diagnostics suppressed\\')\\n')\n(root/'sign_host_separate.py').write_text('\"\"\"Trusted separate GitHub-hosted signer. No checkout or project execution.\"\"\"\\nimport base64\\nimport hashlib\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport re\\nimport subprocess\\nimport tempfile\\nimport zipfile\\nfrom verify_apk import verify\\nSOURCE_SHA = \\'6157ff04e1e039a311c829b58bc7aa03023d0889\\'\\nVERSION_CODE = 1\\n\\ndef require(condition, message):\\n    if not condition:\\n        raise RuntimeError(message)\\n\\ndef run(args):\\n    # Never forward subprocess output on failure: no accidental secret diagnostics.\\n    result = subprocess.run([str(a) for a in args], capture_output=True, text=True, timeout=180,\\n                            env={\"