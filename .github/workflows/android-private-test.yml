            "ANDROID_KEY_PASSWORD": "${{ secrets.ANDROID_KEY_PASSWORD }}"
          },
          "shell": "bash",
          "run": "python3 \"$RUNNER_TEMP/jfm-signer/sign_host_separate.py\""
        },
        {
          "name": "Encrypt final private delivery after signing credentials are removed",
          "shell": "bash",
          "run": "set -euo pipefail\numask 077\nmkdir -m 700 \"$RUNNER_TEMP/asterfin-private-transfer\"\npython3 \"$RUNNER_TEMP/jfm-signer/private_delivery.py\" encrypt-host-result \\\n  --signing-root \"$RUNNER_TEMP/jfm-signer\" \\\n  --certificate \"$RUNNER_TEMP/jfm-signer/private_delivery_recipient.pem\" \\\n  --certificate-pin 1fe0500436cceb73a0d4e4a65e71476440222198a64bc1e7deb7a1a347ffae2c \\\n  --output \"$RUNNER_TEMP/asterfin-private-transfer/delivery.cms\"\npython3 - <<'PYHASH'\nimport hashlib,os\nfrom pathlib import Path\npath=Path(os.environ['RUNNER_TEMP'])/'asterfin-private-transfer/delivery.cms'\nwith path.open('rb') as stream: print('Private delivery ciphertext SHA256: '+hashlib.file_digest(stream,'sha256').hexdigest())\nPYHASH\n"
        },
        {
          "name": "Dispose signer plaintext and temporary keys",
          "if": "${{ always() }}",
          "shell": "bash",
          "run": "set -euo pipefail\nrm -rf -- \"$RUNNER_TEMP/jfm-signer\"\ntest ! -e \"$RUNNER_TEMP/jfm-signer\" && test ! -L \"$RUNNER_TEMP/jfm-signer\"\n"
        },
        {
          "name": "Transfer exactly one authenticated private delivery",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "asterfin-private-test-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/asterfin-private-transfer/delivery.cms",
            "if-no-files-found": "error",
            "retention-days": 1,
            "compression-level": 0,
            "archive": true,
            "overwrite": false,
            "include-hidden-files": false
          }
        },
        {
          "name": "Dispose signer ciphertext",
          "if": "${{ always() }}",
          "shell": "bash",
          "run": "rm -rf -- \"$RUNNER_TEMP/asterfin-private-transfer\""
        }
      ]
    }
  }
}
