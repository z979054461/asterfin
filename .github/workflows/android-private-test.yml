        {
          "name": "Prepare trusted signer without checkout",
          "shell": "bash",
          "run": "python3 - <<'PYTRUSTED'\nimport os\nfrom pathlib import Path\nos.umask(0o077)\nroot=Path(os.environ['RUNNER_TEMP'])/'jfm-signer'\nroot.mkdir(mode=0o700, exist_ok=False)\n(root/'artifact_handshake.py').write_text('\"\"\"Bounded, data-only handshake between two jobs in one reviewed Actions run.\\n\\nOnly GITHUB_TOKEN is used for authenticated REST requests. It is removed from the\\nprocess environment after construction; no subprocess is started. Only public\\nrecipient certificates and encrypted transfer bytes are accepted, never programs.\\n\\nUsage: artifact_handshake.py {fetch-recipient,fetch-unsigned} --output-dir NEW_DIR\\nA successful private directory contains artifact.zip, the exact member, and\\nreceipt.json. artifact_digest is GitHub\\'s authenticated SHA256 archive digest;\\nmember_sha256 is a local content hash, not source/build attestation. REST artifact\\nmetadata does not attest the uploader job. The current-attempt job IDs record\\nobserved job state, not an independent cryptographic source-to-binary claim.\\n\"\"\"\\nimport argparse\\nfrom contextlib import contextmanager\\nfrom dataclasses import dataclass\\nimport hashlib\\nimport hmac\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport re\\nimport shutil\\nimport signal\\nimport ssl\\nimport stat\\nimport struct\\nimport sys\\nimport time\\nimport urllib.error\\nimport urllib.parse\\nimport urllib.request\\nimport zipfile\\n\\nREPOSITORY = \\'z979054461/asterfin\\'\\nREPOSITORY_ID = 1451291617\\nWORKFLOW = \\'.github/workflows/android-private-test.yml\\'\\nBRANCH = \\'mobile-dev\\'\\nBUILD_JOB = \\'Build reviewed source without signing keys\\'\\nSIGN_JOB = \\'Verify and sign on separate runner\\'\\nAPI_ORIGIN = \\'https://api.github.com\\'\\nMAX_CERT = 16 * 1024\\nMAX_TRANSFER = 512 * 1024**2 + 512 * 1024\\nMAX_ARCHIVE = 513 * 1024**2\\nMAX_JSON = 2 * 1024**2\\nMAX_CENTRAL_DIRECTORY = 64 * 1024\\nCHUNK = 64 * 1024\\nDEFAULT_TIMEOUT = 2700\\nMAX_TIMEOUT = 7200\\nPOLL_SECONDS = 5\\n\\n\\nclass HandshakeError(Exception):\\n    \"\"\"Contains only a constant, safe diagnostic, never external error text.\"\"\"\\n\\n\\ndef require(condition, message):\\n    if not condition:\\n        raise HandshakeError(message)\\n\\n\\ndef positive(value):\\n    return type(value) is int and 0 < value <= 2**63 - 1\\n\\n\\ndef env_integer(env, key):\\n    raw = env.get(key, \\'\\')\\n    require(re.fullmatch(r\\'[1-9][0-9]{0,18}\\', raw) is not None,\\n            \\'Invalid runner identity\\')\\n    value = int(raw)\\n    require(positive(value), \\'Invalid runner identity\\')\\n    return value\\n\\n\\n@dataclass(frozen=True)\\nclass Context:\\n    run_id: int\\n    run_attempt: int\\n    workflow_sha: str\\n\\n    @classmethod\\n    def from_env(cls):\\n        env = os.environ\\n        require(not any(name.startswith(\\'ANDROID_KEY\\') for name in env),\\n                \\'Signing credentials must be absent during artifact transfer\\')\\n        require(env.get(\\'GITHUB_ACTIONS\\') == \\'true\\'\\n                and env.get(\\'GITHUB_REPOSITORY\\') == REPOSITORY\\n                and env_integer(env, \\'GITHUB_REPOSITORY_ID\\') == REPOSITORY_ID,\\n                \\'Unexpected runner repository\\')\\n        sha = env.get(\\'GITHUB_SHA\\', \\'\\')\\n        require(re.fullmatch(r\\'[0-9a-f]{40}\\', sha) is not None,\\n                \\'Invalid workflow revision\\')\\n        require(env.get(\\'GITHUB_REF\\') == \\'refs/heads/\\' + BRANCH\\n                and env.get(\\'GITHUB_WORKFLOW_REF\\') == REPOSITORY + \\'/\\' + WORKFLOW\\n                + \\'@refs/heads/\\' + BRANCH,\\n                \\'Unexpected runner workflow\\')\\n        return cls(env_integer(env, \\'GITHUB_RUN_ID\\'),\\n                   env_integer(env, \\'GITHUB_RUN_ATTEMPT\\'), sha)\\n\\n    @property\\n    def prefix(self):\\n        return \\'/repos/\\' + REPOSITORY\\n\\n\\n@dataclass(frozen=True)\\nclass Role:\\n    artifact_prefix: str\\n    member: str\\n    member_limit: int\\n    peer: str\\n    own: str\\n\\n    def artifact_name(self, context):\\n        return f\\'{self.artifact_prefix}-{context.run_id}-{context.run_attempt}\\'\\n\\n\\nROLES = {\\n    \\'fetch-recipient\\': Role(\\'signer-recipient\\', \\'recipient.pem\\', MAX_CERT, SIGN_JOB, BUILD_JOB),\\n    \\'fetch-unsigned\\': Role(\\'unsigned-transfer\\', \\'transfer.cms\\', MAX_TRANSFER, BUILD_JOB, SIGN_JOB),\\n}\\n\\n\\nclass Deadline:\\n    def __init__(self, seconds, now=time.monotonic, sleeper=time.sleep):\\n        require(type(seconds) is int and 1 <= seconds <= MAX_TIMEOUT,\\n                \\'Invalid handshake timeout\\')\\n        self.now, self.sleeper = now, sleeper\\n        self.end = now() + seconds\\n\\n    def remaining(self):\\n        result = self.end - self.now()\\n        require(result > 0, \\'Handshake timed out\\')\\n        return result\\n\\n    def wait(self):\\n        self.sleeper(min(POLL_SECONDS, self.remaining()))\\n        self.remaining()\\n\\n\\n@contextmanager\\ndef process_deadline(seconds):\\n    \"\"\"Ubuntu main-process alarm also bounds a slow/trickling socket or ZIP parse.\"\"\"\\n    def stop(_number, _frame):\\n        raise HandshakeError(\\'Handshake interrupted or timed out\\')\\n\\n    signals = (signal.SIGALRM, signal.SIGTERM, signal.SIGINT)\\n    previous = {number: signal.getsignal(number) for number in signals}\\n    old_timer = signal.getitimer(signal.ITIMER_REAL)\\n    require(old_timer == (0.0, 0.0), \\'Unexpected process timer\\')\\n    try:\\n        for number in signals:\\n            signal.signal(number, stop)\\n        signal.setitimer(signal.ITIMER_REAL, seconds)\\n        yield\\n    finally:\\n        signal.setitimer(signal.ITIMER_REAL, 0)\\n        for number, handler in previous.items():\\n            signal.signal(number, handler)\\n\\n\\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\\n        return None\\n\\n\\ndef safe_storage_url(url):\\n    \"\"\"Permit only GitHub artifact storage endpoints, never arbitrary Azure/S3.\"\"\"\\n    require(type(url) is str and 1 <= len(url) <= 16384\\n            and not any(ord(c) <= 32 or ord(c) >= 127 for c in url),\\n            \\'Invalid artifact storage redirect\\')\\n    try:\\n        parsed = urllib.parse.urlsplit(url)\\n        host, port = parsed.hostname, parsed.port\\n    except ValueError:\\n        raise HandshakeError(\\'Invalid artifact storage redirect\\') from None\\n    # Current Actions artifact storage uses GitHub production Azure accounts.\\n    # The exact GitHub-owned S3 legacy bucket and GitHub download host are also\\n    # supported. A broad *.amazonaws.com or *.blob.core.windows.net is NOT safe.\\n    azure = host and re.fullmatch(r\\'productionresultssa[0-9]+\\\\.blob\\\\.core\\\\.windows\\\\.net\\', host)\\n    s3 = host in (\\'pipelines.actions.githubusercontent.com\\',\\n                  \\'productionresultssa0.blob.core.windows.net\\',\\n                  \\'github-production-repository-file-5c1aeb.s3.amazonaws.com\\')\\n    require(parsed.scheme == \\'https\\' and bool(azure or s3) and port in (None, 443)\\n            and parsed.username is None and parsed.password is None\\n            and not parsed.fragment and parsed.path.startswith(\\'/\\')\\n            and not parsed.netloc.endswith(\\'.\\'),\\n            \\'Untrusted artifact storage redirect\\')\\n    return url\\n\\n\\ndef unique_object(pairs):\\n    result = {}\\n    for key, value in pairs:\\n        require(key not in result, \\'Duplicate API JSON field\\')\\n        result[key] = value\\n    return result\\n\\n\\ndef response_length(headers, limit):\\n    value = headers.get(\\'Content-Length\\')\\n    if value is None:\\n        return None\\n    require(re.fullmatch(r\\'[0-9]{1,12}\\', value) is not None,\\n            \\'Invalid response length\\')\\n    length = int(value)\\n    require(0 < length <= limit, \\'Response exceeds size bound\\')\\n    return length\\n\\n\\nclass GitHubAPI:\\n    def __init__(self, deadline):\\n        token = os.environ.pop(\\'GITHUB_TOKEN\\', \\'\\')\\n        require(type(token) is str and 1 <= len(token) <= 4096\\n                and all(33 <= ord(c) <= 126 for c in token),\\n                \\'Built-in workflow token is unavailable\\')\\n        self._authorization = \\'Bearer \\' + token\\n        self.deadline = deadline\\n        # Do not follow redirects or inherit proxy routing from the environment.\\n        self.opener = urllib.request.build_opener(\\n            urllib.request.ProxyHandler({}), NoRedirect(),\\n            urllib.request.HTTPSHandler(context=ssl.create_default_context()))\\n\\n    def _open(self, request):\\n        try:\\n            return self.opener.open(request, timeout=min(20, self.deadline.remaining()))\\n        except urllib.error.HTTPError as error:\\n            # 302 is deliberately returned, never followed by this opener.\\n            if error.code == 302:\\n                return error\\n            error.close()\\n            raise HandshakeError(\\'GitHub request failed\\') from None\\n        except (OSError, ValueError, urllib.error.URLError):\\n            raise HandshakeError(\\'Network request failed\\') from None\\n\\n    def _api_request(self, path):\\n        require(path.startswith(\\'/repos/\\' + REPOSITORY + \\'/\\')\\n                or path == \\'/repos/\\' + REPOSITORY,\\n                \\'Unexpected API target\\')\\n        require(\\'#\\' not in path and \\'\\\\\\\\\\' not in path and \\'\\\\r\\' not in path and \\'\\\\n\\' not in path,\\n                \\'Unexpected API target\\')\\n        return urllib.request.Request(API_ORIGIN + path, headers={\\n            \\'Authorization\\': self._authorization,\\n            \\'Accept\\': \\'application/vnd.github+json\\',\\n            \\'X-GitHub-Api-Version\\': \\'2022-11-28\\',\\n            \\'User-Agent\\': \\'asterfin-private-artifact-handshake\\',\\n            \\'Accept-Encoding\\': \\'identity\\',\\n        })\\n\\n    def json(self, path):\\n        with self._open(self._api_request(path)) as response:\\n            require(response.status == 200, \\'Unexpected GitHub API response\\')\\n            require(response.headers.get(\\'Content-Encoding\\', \\'identity\\') == \\'identity\\',\\n                    \\'Unexpected response encoding\\')\\n            length = response_length(response.headers, MAX_JSON)\\n            chunks, total = [], 0\\n            while True:\\n                self.deadline.remaining()\\n                part = response.read(min(CHUNK, MAX_JSON + 1 - total))\\n                if not part:\\n                    break\\n                total += len(part)\\n                require(total <= MAX_JSON, \\'API response exceeds size bound\\')\\n                chunks.append(part)\\n            require(length is None or length == total, \\'Truncated API response\\')\\n        try:\\n            value = json.loads(b\\'\\'.join(chunks), object_pairs_hook=unique_object)\\n        except (UnicodeError, ValueError, RecursionError):\\n            raise HandshakeError(\\'Malformed GitHub API metadata\\') from None\\n        require(type(value) is dict, \\'Unexpected API metadata\\')\\n        return value\\n\\n    def download(self, artifact_id, destination, expected_size, expected_digest):\\n        require(positive(artifact_id) and type(expected_size) is int\\n                and 0 < expected_size <= MAX_ARCHIVE\\n                and type(expected_digest) is str\\n                and re.fullmatch(r\\'sha256:[a-f0-9]{64}\\', expected_digest) is not None,\\n                \\'Invalid authenticated download identity\\')\\n        path = f\\'/repos/{REPOSITORY}/actions/artifacts/{artifact_id}/zip\\'\\n        with self._open(self._api_request(path)) as response:\\n            require(response.status == 302, \\'Expected authenticated artifact redirect\\')\\n            url = safe_storage_url(response.headers.get(\\'Location\\'))\\n        # Deliberately construct an entirely new request, with NO authorization.\\n        request = urllib.request.Request(url, headers={\\n            \\'User-Agent\\': \\'asterfin-private-artifact-handshake\\',\\n            \\'Accept-Encoding\\': \\'identity\\',\\n        })\\n        with self._open(request) as response:\\n            require(response.status == 200, \\'Unexpected artifact storage response\\')\\n            require(response.headers.get(\\'Content-Encoding\\', \\'identity\\') == \\'identity\\',\\n                    \\'Unexpected artifact encoding\\')\\n            length = response_length(response.headers, MAX_ARCHIVE)\\n            require(length is None or length == expected_size,\\n                    \\'Artifact size does not match GitHub metadata\\')\\n            total, digest = 0, hashlib.sha256()\\n            with private_file(destination) as output:\\n                while True:\\n                    self.deadline.remaining()\\n                    chunk = response.read(min(CHUNK, MAX_ARCHIVE + 1 - total))\\n                    if not chunk:\\n                        break\\n                    total += len(chunk)\\n                    require(total <= MAX_ARCHIVE and total <= expected_size,\\n                            \\'Artifact exceeds authenticated size bound\\')\\n                    digest.update(chunk)\\n                    output.write(chunk)\\n            require(total == expected_size, \\'Truncated artifact archive\\')\\n            require(hmac.compare_digest(\\'sha256:\\' + digest.hexdigest(), expected_digest),\\n                    \\'Artifact archive digest mismatch\\')\\n        return digest.hexdigest()\\n\\n\\ndef private_file(path):\\n    fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)\\n    return os.fdopen(fd, \\'wb\\')\\n\\n\\ndef verify_repository(data):\\n    require(type(data) is dict and data.get(\\'id\\') == REPOSITORY_ID\\n            and type(data.get(\\'id\\')) is int and data.get(\\'full_name\\') == REPOSITORY,\\n            \\'Repository identity mismatch\\')\\n\\n\\ndef verify_run(data, context):\\n    require(data.get(\\'id\\') == context.run_id and type(data.get(\\'id\\')) is int\\n            and data.get(\\'run_attempt\\') == context.run_attempt\\n            and type(data.get(\\'run_attempt\\')) is int\\n            and data.get(\\'head_sha\\') == context.workflow_sha\\n            and data.get(\\'head_branch\\') == BRANCH and data.get(\\'path\\') == WORKFLOW,\\n            \\'Workflow run identity mismatch\\')\\n    verify_repository(data.get(\\'repository\\'))\\n    verify_repository(data.get(\\'head_repository\\'))\\n    require(data.get(\\'event\\') in (\\'push\\', \\'workflow_dispatch\\'), \\'Unexpected workflow trigger\\')\\n    require(data.get(\\'status\\') in (\\'queued\\', \\'requested\\', \\'waiting\\', \\'pending\\', \\'in_progress\\')\\n            and data.get(\\'conclusion\\') is None,\\n            \\'Workflow is no longer active\\')\\n\\n\\ndef verify_jobs(data, context, role):\\n    jobs = data.get(\\'jobs\\')\\n    require(type(jobs) is list and type(data.get(\\'total_count\\')) is int\\n            and data[\\'total_count\\'] == len(jobs) and len(jobs) <= 100,\\n            \\'Incomplete or oversized current-attempt job list\\')\\n    selected = {}\\n    seen = set()\\n    for job in jobs:\\n        require(type(job) is dict and positive(job.get(\\'id\\')) and job[\\'id\\'] not in seen,\\n                \\'Invalid or duplicate job identity\\')\\n        seen.add(job[\\'id\\'])\\n        if job.get(\\'name\\') not in (BUILD_JOB, SIGN_JOB):\\n            continue\\n        name = job[\\'name\\']\\n        require(name not in selected and job.get(\\'run_id\\') == context.run_id\\n                and type(job.get(\\'run_id\\')) is int\\n                and job.get(\\'head_sha\\') == context.workflow_sha,\\n                \\'Current-attempt job identity mismatch\\')\\n        if \\'run_attempt\\' in job:\\n            require(type(job[\\'run_attempt\\']) is int and job[\\'run_attempt\\'] == context.run_attempt,\\n                    \\'Job attempt mismatch\\')\\n        selected[name] = job\\n    require(role.own in selected and selected[role.own].get(\\'status\\') == \\'in_progress\\'\\n            and selected[role.own].get(\\'conclusion\\') is None,\\n            \\'Receiving job is not active\\')\\n    peer = selected.get(role.peer)\\n    if peer is None:\\n        return None\\n    status, conclusion = peer.get(\\'status\\'), peer.get(\\'conclusion\\')\\n    require(status in (\\'queued\\', \\'waiting\\', \\'pending\\', \\'in_progress\\', \\'completed\\'),\\n            \\'Unexpected peer job state\\')\\n    if status == \\'completed\\':\\n        require(role.peer == BUILD_JOB and conclusion == \\'success\\',\\n                \\'Peer job completed without required success\\')\\n        return selected\\n    require(conclusion is None, \\'Unexpected peer job conclusion\\')\\n    if role.peer == SIGN_JOB and status == \\'in_progress\\':\\n        return selected\\n    return None\\n\\n\\ndef observe_jobs(api, context, role):\\n    verify_run(api.json(f\\'{context.prefix}/actions/runs/{context.run_id}\\'), context)\\n    # The attempt-qualified endpoint prevents jobs from earlier reruns entering\\n    # the handshake even though the artifact list is shared across all attempts.\\n    path = (f\\'{context.prefix}/actions/runs/{context.run_id}/attempts/\\'\\n            f\\'{context.run_attempt}/jobs?per_page=100&page=1\\')\\n    return verify_jobs(api.json(path), context, role)\\n\\n\\ndef verify_artifact(data, context, role):\\n    require(type(data) is dict and positive(data.get(\\'id\\'))\\n            and data.get(\\'name\\') == role.artifact_name(context)\\n            and data.get(\\'expired\\') is False,\\n            \\'Artifact identity or expiry mismatch\\')\\n    size, digest = data.get(\\'size_in_bytes\\'), data.get(\\'digest\\')\\n    # Certificate archive bounds are tighter than the encrypted transfer bound.\\n    bound = MAX_CERT + MAX_CENTRAL_DIRECTORY if role.member == \\'recipient.pem\\' else MAX_ARCHIVE\\n    require(type(size) is int and 0 < size <= bound,\\n            \\'Artifact metadata size exceeds bound\\')\\n    require(type(digest) is str and re.fullmatch(r\\'sha256:[a-f0-9]{64}\\', digest) is not None,\\n            \\'Authenticated artifact SHA256 is missing\\')\\n    run = data.get(\\'workflow_run\\')\\n    require(type(run) is dict and run.get(\\'id\\') == context.run_id\\n            and type(run.get(\\'id\\')) is int\\n            and run.get(\\'repository_id\\') == REPOSITORY_ID\\n            and type(run.get(\\'repository_id\\')) is int\\n            and run.get(\\'head_repository_id\\') == REPOSITORY_ID\\n            and type(run.get(\\'head_repository_id\\')) is int\\n            and run.get(\\'head_branch\\') == BRANCH\\n            and run.get(\\'head_sha\\') == context.workflow_sha,\\n            \\'Artifact workflow provenance mismatch\\')\\n    return {\\'id\\': data[\\'id\\'], \\'name\\': data[\\'name\\'], \\'size\\': size, \\'digest\\': digest}\\n\\n\\ndef find_artifact(api, context, role):\\n    # Query all run artifacts, rather than trusting a name-filtered partial list.\\n    data = api.json(f\\'{context.prefix}/actions/runs/{context.run_id}/artifacts?per_page=100&page=1\\')\\n    artifacts = data.get(\\'artifacts\\')\\n    require(type(artifacts) is list and type(data.get(\\'total_count\\')) is int\\n            and len(artifacts) == data[\\'total_count\\'] and len(artifacts) <= 100,\\n            \\'Incomplete or oversized artifact list\\')\\n    require(all(type(item) is dict and positive(item.get(\\'id\\')) for item in artifacts),\\n            \\'Invalid artifact list\\')\\n    require(len({item[\\'id\\'] for item in artifacts}) == len(artifacts),\\n            \\'Duplicate artifact identity\\')\\n    matches = [item for item in artifacts if item.get(\\'name\\') == role.artifact_name(context)]\\n    require(len(matches) <= 1, \\'Artifact name is not unique\\')\\n    if not matches:\\n        return None\\n    artifact = verify_artifact(matches[0], context, role)\\n    exact = verify_artifact(api.json(f\"{context.prefix}/actions/artifacts/{artifact[\\'id\\']}\"), context, role)\\n    require(exact == artifact, \\'Artifact metadata changed\\')\\n    return artifact\\n\\n\\ndef bounded_zip_directory(stream, size):\\n    \"\"\"Check entry count/central-directory budget before zipfile allocates it.\"\"\"\\n    stream.seek(max(0, size - 65557))\\n    tail = stream.read(65557)\\n    index = tail.rfind(b\\'PK\\\\x05\\\\x06\\')\\n    require(index >= 0 and index + 22 <= len(tail), \\'Invalid ZIP end record\\')\\n    fields = struct.unpack_from(\\'<4s4H2LH\\', tail, index)\\n    _, disk, start_disk, disk_count, count, central_size, central_offset, comment = fields\\n    require(disk == start_disk == 0 and index + 22 + comment == len(tail),\\n            \\'Multipart or trailing ZIP data\\')\\n    end_offset = size - len(tail) + index\\n    central_end = end_offset\\n    # ZIP64 may be used by an uploader even for a small artifact.\\n    if end_offset >= 20:\\n        stream.seek(end_offset - 20)\\n        locator = stream.read(20)\\n        if locator[:4] == b\\'PK\\\\x06\\\\x07\\':\\n            _, start_disk64, record_offset, disks = struct.unpack(\\'<4sLQL\\', locator)\\n            require(start_disk64 == 0 and disks == 1 and record_offset + 56 <= end_offset - 20,\\n                    \\'Invalid ZIP64 locator\\')\\n            stream.seek(record_offset)\\n            record = stream.read(56)\\n            require(len(record) == 56 and record[:4] == b\\'PK\\\\x06\\\\x06\\', \\'Invalid ZIP64 end record\\')\\n            (_, record_size, _, _, disk64, start64, disk_count64,\\n             count64, size64, offset64) = struct.unpack(\\'<4sQ2H2L4Q\\', record)\\n            require(44 <= record_size <= MAX_CENTRAL_DIRECTORY\\n                    and record_offset + 12 + record_size == end_offset - 20\\n                    and disk64 == start64 == 0,\\n                    \\'Invalid ZIP64 layout\\')\\n            require(disk_count in (disk_count64, 0xffff) and count in (count64, 0xffff)\\n                    and central_size in (size64, 0xffffffff)\\n                    and central_offset in (offset64, 0xffffffff), \\'Inconsistent ZIP64 metadata\\')\\n            disk_count, count, central_size, central_offset = disk_count64, count64, size64, offset64\\n            central_end = record_offset\\n    require(count == disk_count == 1 and 46 <= central_size <= MAX_CENTRAL_DIRECTORY\\n            and 0 < central_offset < size and central_offset + central_size == central_end,\\n            \\'Unexpected ZIP directory size or member count\\')\\n    return central_offset\\n\\n\\ndef extract_member(archive_path, destination, role, deadline):\\n    fd = os.open(archive_path, os.O_RDONLY | os.O_NOFOLLOW)\\n    with os.fdopen(fd, \\'rb\\') as stream:\\n        info = os.fstat(stream.fileno())\\n        require(stat.S_ISREG(info.st_mode) and 0 < info.st_size <= MAX_ARCHIVE,\\n                \\'Invalid artifact archive file\\')\\n        central_offset = bounded_zip_directory(stream, info.st_size)\\n        stream.seek(0)\\n        with zipfile.ZipFile(stream) as archive:\\n            infos = archive.infolist()\\n            require(len(infos) == 1, \\'Unexpected artifact member count\\')\\n            member = infos[0]\\n            require(member.filename == member.orig_filename == role.member\\n                    and member.header_offset == 0 and not member.is_dir()\\n                    and not member.external_attr & 0x10\\n                    and stat.S_IFMT(member.external_attr >> 16) in (0, stat.S_IFREG)\\n                    and member.flag_bits & ~0x80e == 0\\n                    and member.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED)\\n                    and 0 < member.file_size <= role.member_limit\\n                    and 0 < member.compress_size <= role.member_limit + MAX_CENTRAL_DIRECTORY,\\n                    \\'Unsafe artifact member\\')\\n            # Confirm the local header and contiguous data layout, excluding\\n            # hidden local entries, executable preambles, or arbitrary padding.\\n            stream.seek(0)\\n            header = stream.read(30)\\n            require(len(header) == 30 and header[:4] == b\\'PK\\\\x03\\\\x04\\', \\'Invalid ZIP local header\\')\\n            values = struct.unpack(\\'<4s5H3L2H\\', header)\\n            require(values[2] == member.flag_bits and values[3] == member.compress_type,\\n                    \\'Inconsistent ZIP local header\\')\\n            name_length, extra_length = values[-2:]\\n            require(name_length == len(role.member) and extra_length <= MAX_CENTRAL_DIRECTORY\\n                    and stream.read(name_length) == role.member.encode(\\'ascii\\'),\\n                    \\'Unsafe ZIP local filename\\')\\n            data_end = 30 + name_length + extra_length + member.compress_size\\n            descriptor_length = central_offset - data_end\\n            allowed = (12, 16, 20, 24) if member.flag_bits & 8 else (0,)\\n            require(descriptor_length in allowed, \\'Unexpected ZIP local data layout\\')\\n            total, digest = 0, hashlib.sha256()\\n            with archive.open(member) as source, private_file(destination) as target:\\n                while True:\\n                    deadline.remaining()\\n                    chunk = source.read(CHUNK)\\n                    if not chunk:\\n                        break\\n                    total += len(chunk)\\n                    require(total <= role.member_limit and total <= member.file_size,\\n                            \\'Artifact expansion exceeds bound\\')\\n                    digest.update(chunk)\\n                    target.write(chunk)\\n            require(total == member.file_size, \\'Truncated artifact member\\')\\n    return digest.hexdigest()\\n\\n\\ndef fetch(role_name, output_dir, context, api, deadline):\\n    require(role_name in ROLES, \\'Unknown handshake role\\')\\n    role = ROLES[role_name]\\n    output = Path(output_dir)\\n    require(output.name not in (\\'\\', \\'.\\', \\'..\\') and not output.exists() and not output.is_symlink(),\\n            \\'Output directory must be new\\')\\n    # The parent must exist; no traversal, untrusted ZIP paths, or external files\\n    # are created. Outputs remain private even with a permissive caller umask.\\n    output.mkdir(mode=0o700, exist_ok=False)\\n    completed = False\\n    try:\\n        verify_repository(api.json(context.prefix))\\n        while True:\\n            deadline.remaining()\\n            jobs = observe_jobs(api, context, role)\\n            artifact = find_artifact(api, context, role) if jobs is not None else None\\n            if artifact is not None:\\n                break\\n            deadline.wait()\\n        jobs = observe_jobs(api, context, role)\\n        require(jobs is not None, \\'Peer state changed before download\\')\\n        archive_sha = api.download(artifact[\\'id\\'], output/\\'artifact.zip\\', artifact[\\'size\\'], artifact[\\'digest\\'])\\n        # The authenticated archive hash is preserved in the receipt and archive\\n        # is retained. No member parsing occurs before the hash check succeeds.\\n        require(archive_sha == artifact[\\'digest\\'][7:], \\'Archive authentication failed\\')\\n        member_sha = extract_member(output/\\'artifact.zip\\', output/role.member, role, deadline)\\n        exact = verify_artifact(api.json(f\"{context.prefix}/actions/artifacts/{artifact[\\'id\\']}\"), context, role)\\n        require(exact == artifact, \\'Artifact metadata changed during transfer\\')\\n        final_jobs = observe_jobs(api, context, role)\\n        require(final_jobs is not None\\n                and all(final_jobs[name][\\'id\\'] == jobs[name][\\'id\\'] for name in (BUILD_JOB, SIGN_JOB)),\\n                \\'Job identity or state changed during transfer\\')\\n        receipt = {\\n            \\'repository_id\\': REPOSITORY_ID, \\'repository\\': REPOSITORY,\\n            \\'run_id\\': context.run_id, \\'run_attempt\\': context.run_attempt,\\n            \\'workflow_path\\': WORKFLOW, \\'workflow_sha\\': context.workflow_sha,\\n            \\'head_branch\\': BRANCH, \\'role\\': role_name,\\n            \\'artifact_id\\': artifact[\\'id\\'], \\'artifact_name\\': artifact[\\'name\\'],\\n            \\'artifact_digest\\': artifact[\\'digest\\'], \\'artifact_size\\': artifact[\\'size\\'],\\n            \\'job_id\\': final_jobs[role.peer][\\'id\\'], \\'job_name\\': role.peer,\\n            \\'source_build_job_id\\': final_jobs[BUILD_JOB][\\'id\\'],\\n            \\'signing_job_id\\': final_jobs[SIGN_JOB][\\'id\\'],\\n            \\'member_name\\': role.member, \\'member_sha256\\': member_sha,\\n        }\\n        with private_file(output/\\'receipt.json\\') as stream:\\n            stream.write((json.dumps(receipt, sort_keys=True) + \\'\\\\n\\').encode(\\'ascii\\'))\\n        completed = True\\n        return receipt\\n    finally:\\n        if not completed:\\n            shutil.rmtree(output)\\n\\n\\nclass SafeArgumentParser(argparse.ArgumentParser):\\n    def error(self, _message):\\n        # argparse\\'s default repeats unrecognized arguments and raw values.\\n        self.exit(2, \\'Artifact handshake failed: invalid command-line options\\\\n\\')\\n\\n\\ndef main(argv=None):\\n    parser = SafeArgumentParser(description=__doc__, allow_abbrev=False)\\n    parser.add_argument(\\'role\\', choices=tuple(ROLES))\\n    parser.add_argument(\\'--output-dir\\', required=True)\\n    parser.add_argument(\\'--timeout\\', type=int, default=DEFAULT_TIMEOUT)\\n    args = parser.parse_args(argv)\\n    try:\\n        os.umask(0o077)\\n        context = Context.from_env()\\n        deadline = Deadline(args.timeout)\\n        with process_deadline(args.timeout):\\n            receipt = fetch(args.role, args.output_dir, context, GitHubAPI(deadline), deadline)\\n        # Only bounded, validated identities and hashes are printable, no paths,\\n        # credentials, raw exceptions, response bodies, or signed download URLs.\\n        print(json.dumps(receipt, sort_keys=True))\\n        return 0\\n    except HandshakeError as error:\\n        print(\\'Artifact handshake failed: \\' + str(error), file=sys.stderr)\\n    except Exception:\\n        print(\\'Artifact handshake failed; diagnostics suppressed\\', file=sys.stderr)\\n    return 1\\n\\n\\nif __name__ == \\'__main__\\':\\n    raise SystemExit(main())\\n')\n(root/'unsigned_transfer.py').write_text('\"\"\"One-run unsigned APK transport between separate build and signing runners.\\n\\nCMS authenticates transport integrity, NOT build provenance or APK correctness.\\nArtifact provenance is verified by the caller; independent APK validation must\\nrun after decrypt and before the Android signing Secrets enter any process.\\nThe final-delivery recipient/key are never used by this module.\\n\"\"\"\\nimport argparse\\nimport base64\\nimport hashlib\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport re\\nimport resource\\nimport shutil\\nimport stat\\nimport struct\\nimport subprocess\\nimport tempfile\\nimport zipfile\\n\\nfrom private_delivery import inspect_envelope, tlv, children, oid, unique_object\\n\\nSOURCE_SHA = \\'6157ff04e1e039a311c829b58bc7aa03023d0889\\'\\nVERSION_CODE = 1\\nPACKAGE = \\'org.personal.jellyfinmobile.dev\\'\\nRECIPIENT_CN = b\\'Asterfin Ephemeral Transfer\\'\\nMAX_APK = 512 * 1024**2\\nMAX_MANIFEST = 16 * 1024\\nMAX_ZIP = MAX_APK + MAX_MANIFEST + 65536\\nMAX_CIPHERTEXT = MAX_ZIP + 65536\\nMAX_CERT = 16384\\nMAX_KEY = 16384\\nENTRIES = (\\'unsigned.apk\\', \\'verification.json\\')\\nMANIFEST_KEYS = {\\'source_commit\\', \\'version_code\\', \\'package\\', \\'unsigned_sha256\\', \\'run_id\\', \\'run_attempt\\'}\\nSTATE_KEYS = {\\'run_id\\', \\'run_attempt\\', \\'certificate_sha256\\'}\\nRECIPIENT_FILES = {\\'recipient-key.pem\\', \\'recipient.pem\\', \\'recipient-state.json\\'}\\nENV = {\\'PATH\\': \\'/usr/bin:/bin\\', \\'LANG\\': \\'C\\', \\'LC_ALL\\': \\'C\\', \\'OPENSSL_CONF\\': \\'/dev/null\\'}\\n\\n\\nclass TransferError(RuntimeError):\\n    pass\\n\\n\\ndef require(value, message=\\'Unsigned transfer validation failed\\'):\\n    if not value:\\n        raise TransferError(message)\\n\\n\\ndef no_signing_secrets():\\n    require(not any(name.startswith(\\'ANDROID_KEY\\') for name in os.environ),\\n            \\'Android signing credentials must not enter unsigned transfer\\')\\n\\n\\ndef identity(run_id, run_attempt, source=SOURCE_SHA, version=VERSION_CODE):\\n    require(isinstance(run_id, str) and re.fullmatch(r\\'[1-9][0-9]{0,18}\\', run_id)\\n            and int(run_id) < 2**63, \\'Invalid current workflow run identity\\')\\n    require(type(run_attempt) is int and 1 <= run_attempt < 2**31,\\n            \\'Invalid current workflow attempt\\')\\n    require(source == SOURCE_SHA and type(version) is int and version == VERSION_CODE,\\n            \\'Unreviewed source or version\\')\\n    return run_id, run_attempt\\n\\n\\ndef regular(path, maximum, private=False):\\n    item = Path(path).lstat()\\n    require(stat.S_ISREG(item.st_mode) and item.st_nlink == 1 and 0 < item.st_size <= maximum,\\n            \\'Unexpected transport file type or size\\')\\n    if private:\\n        require(item.st_uid == os.geteuid() and stat.S_IMODE(item.st_mode) == 0o600,\\n                \\'Private transport file permissions invalid\\')\\n    return item\\n\\n\\ndef private_directory(path):\\n    item = Path(path).lstat()\\n    require(stat.S_ISDIR(item.st_mode) and item.st_uid == os.geteuid()\\n            and stat.S_IMODE(item.st_mode) == 0o700, \\'Private transport directory invalid\\')\\n\\n\\ndef digest(path):\\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\\n    with os.fdopen(fd, \\'rb\\') as stream:\\n        return hashlib.file_digest(stream, \\'sha256\\').hexdigest()\\n\\n\\ndef crypto(args, maximum_file=MAX_ZIP, timeout=180):\\n    def limits():\\n        resource.setrlimit(resource.RLIMIT_CORE, (0, 0))\\n        resource.setrlimit(resource.RLIMIT_AS, (4 * 1024**3, 4 * 1024**3))\\n        resource.setrlimit(resource.RLIMIT_FSIZE, (maximum_file, maximum_file))\\n    result = subprocess.run([\\'/usr/bin/openssl\\', *map(str, args)], stdin=subprocess.DEVNULL,\\n                            stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=timeout,\\n                            env=ENV, preexec_fn=limits)\\n    require(result.returncode == 0 and len(result.stdout) <= 32768 and len(result.stderr) <= 32768,\\n            \\'Unsigned transfer cryptographic operation failed\\')\\n    return result.stdout\\n\\n\\ndef load_json(path, maximum=MAX_MANIFEST):\\n    regular(path, maximum)\\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\\n    with os.fdopen(fd, \\'rb\\') as stream:\\n        encoded = stream.read(maximum + 1)\\n        require(len(encoded) <= maximum)\\n        value = json.loads(encoded, object_pairs_hook=unique_object)\\n    require(isinstance(value, dict), \\'Expected transport JSON object\\')\\n    return value\\n\\n\\ndef write_json(path, value):\\n    encoded = json.dumps(value, sort_keys=True, separators=(\\',\\', \\':\\')).encode(\\'utf-8\\')\\n    require(0 < len(encoded) <= MAX_MANIFEST)\\n    fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)\\n    with os.fdopen(fd, \\'wb\\') as stream:\\n        stream.write(encoded)\\n        stream.flush()\\n        os.fsync(stream.fileno())\\n\\n\\ndef generic_name(der, name):\\n    require(name[0] == 0x30)\\n    sets = children(der, name)\\n    require(len(sets) == 1 and sets[0][0] == 0x31)\\n    entries = children(der, sets[0])\\n    require(len(entries) == 1 and entries[0][0] == 0x30)\\n    fields = children(der, entries[0])\\n    require(len(fields) == 2 and oid(der, fields[0], \\'550403\\')\\n            and fields[1][0] in (0x0c, 0x13)\\n            and der[fields[1][1]:fields[1][2]] == RECIPIENT_CN,\\n            \\'Recipient subject must be generic\\')\\n\\n\\ndef inspect_certificate(certificate):\\n    \"\"\"Accept exactly one public certificate, generic DN, RSA4096/e65537 only.\"\"\"\\n    regular(certificate, MAX_CERT)\\n    fd = os.open(certificate, os.O_RDONLY | os.O_NOFOLLOW)\\n    with os.fdopen(fd, \\'rb\\') as stream:\\n        body = stream.read(MAX_CERT + 1)\\n    require(len(body) <= MAX_CERT)\\n    match = re.fullmatch(rb\\'-----BEGIN CERTIFICATE-----\\\\r?\\\\n([A-Za-z0-9+/=\\\\r\\\\n]+)\\\\r?\\\\n-----END CERTIFICATE-----\\\\r?\\\\n?\\', body)\\n    require(match is not None and b\\'PRIVATE KEY\\' not in body, \\'Expected public recipient certificate only\\')\\n    try:\\n        der = base64.b64decode(re.sub(rb\\'[\\\\r\\\\n]\\', b\\'\\', match.group(1)), validate=True)\\n    except ValueError:\\n        raise TransferError(\\'Malformed public recipient certificate\\') from None\\n    top = tlv(der, 0, len(der))\\n    require(top[0] == 0x30 and top[2] == len(der))\\n    certificate_fields = children(der, top)\\n    require(len(certificate_fields) == 3 and certificate_fields[0][0] == 0x30)\\n    tbs = children(der, certificate_fields[0])\\n    require(len(tbs) in (7, 8) and tbs[0][0] == 0xa0)\\n    generic_name(der, tbs[3])\\n    generic_name(der, tbs[5])\\n    spki = tbs[6]\\n    require(spki[0] == 0x30)\\n    fields = children(der, spki)\\n    require(len(fields) == 2 and fields[0][0] == 0x30 and fields[1][0] == 3)\\n    algorithm = children(der, fields[0])\\n    require(len(algorithm) == 2 and oid(der, algorithm[0], \\'2a864886f70d010101\\')\\n            and algorithm[1][0] == 5 and algorithm[1][1] == algorithm[1][2],\\n            \\'Recipient must use RSA encryption key\\')\\n    bits = der[fields[1][1]:fields[1][2]]\\n    require(bits and bits[0] == 0)\\n    key = bits[1:]\\n    node = tlv(key, 0, len(key))\\n    require(node[0] == 0x30 and node[2] == len(key))\\n    integers = children(key, node)\\n    require(len(integers) == 2 and all(x[0] == 2 for x in integers))\\n    modulus = key[integers[0][1]:integers[0][2]]\\n    exponent = key[integers[1][1]:integers[1][2]]\\n    require(len(modulus) == 513 and modulus[0] == 0 and modulus[1] >= 128\\n            and int.from_bytes(modulus, \\'big\\').bit_length() == 4096\\n            and exponent == b\\'\\\\x01\\\\x00\\\\x01\\', \\'Recipient must be RSA4096/e65537\\')\\n    if len(tbs) == 8:\\n        require(tbs[7][0] == 0xa3)\\n        wrapped = children(der, tbs[7])\\n        require(len(wrapped) == 1 and wrapped[0][0] == 0x30)\\n        seen = set()\\n        allowed = {bytes.fromhex(x) for x in (\\'551d13\\', \\'551d0f\\', \\'551d0e\\', \\'551d23\\')}\\n        for extension in children(der, wrapped[0]):\\n            require(extension[0] == 0x30)\\n            parts = children(der, extension)\\n            require(len(parts) in (2, 3) and parts[0][0] == 6 and parts[-1][0] == 4)\\n            name = der[parts[0][1]:parts[0][2]]\\n            require(name in allowed and name not in seen, \\'Unexpected recipient identifying extension\\')\\n            value = der[parts[-1][1]:parts[-1][2]]\\n            expected = {bytes.fromhex(\\'551d13\\'): b\\'\\\\x30\\\\x00\\',\\n                        bytes.fromhex(\\'551d0f\\'): b\\'\\\\x03\\\\x02\\\\x05\\\\x20\\',\\n                        bytes.fromhex(\\'551d0e\\'): b\\'\\\\x04\\\\x14\\' + hashlib.sha1(key).digest(),\\n                        bytes.fromhex(\\'551d23\\'): b\\'\\\\x30\\\\x16\\\\x80\\\\x14\\' + hashlib.sha1(key).digest()}\\n            require(value == expected[name], \\'Unexpected recipient extension contents\\')\\n            seen.add(name)\\n        require({bytes.fromhex(\\'551d13\\'), bytes.fromhex(\\'551d0f\\')} <= seen)\\n    # Confirm DER interpretation with trusted OpenSSL and verify self-signature/time.\\n    require(crypto([\\'x509\\', \\'-in\\', certificate, \\'-outform\\', \\'DER\\'], maximum_file=MAX_CERT) == der)\\n    crypto([\\'verify\\', \\'-check_ss_sig\\', \\'-no-CAfile\\', \\'-no-CApath\\', \\'-no-CAstore\\',\\n            \\'-trusted\\', certificate, certificate], maximum_file=MAX_CERT)\\n    # Return SubjectPublicKeyInfo DER for a signer-side public/private match check.\\n    spki_der = crypto([\\'x509\\', \\'-in\\', certificate, \\'-pubkey\\', \\'-noout\\'], maximum_file=MAX_CERT)\\n    return hashlib.sha256(der).hexdigest(), spki_der\\n\\n\\ndef remove_owned_tree(path):\\n    if Path(path).exists():\\n        shutil.rmtree(path)\\n    require(not Path(path).exists() and not Path(path).is_symlink(), \\'Unsigned transport cleanup unverified\\')\\n\\n\\ndef prepare_recipient(directory, run_id, run_attempt):\\n    no_signing_secrets()\\n    identity(run_id, run_attempt)\\n    os.umask(0o077)\\n    directory = Path(directory)\\n    directory.mkdir(mode=0o700, exist_ok=False)\\n    succeeded = False\\n    try:\\n        private_directory(directory)\\n        key, cert = directory / \\'recipient-key.pem\\', directory / \\'recipient.pem\\'\\n        crypto([\\'genpkey\\', \\'-algorithm\\', \\'RSA\\', \\'-pkeyopt\\', \\'rsa_keygen_bits:4096\\',\\n                \\'-pkeyopt\\', \\'rsa_keygen_pubexp:65537\\', \\'-out\\', key], maximum_file=MAX_KEY)\\n        key.chmod(0o600)\\n        regular(key, MAX_KEY, private=True)\\n        crypto([\\'req\\', \\'-new\\', \\'-x509\\', \\'-sha256\\', \\'-key\\', key, \\'-days\\', \\'1\\',\\n                \\'-subj\\', \\'/CN=\\' + RECIPIENT_CN.decode(\\'ascii\\'), \\'-out\\', cert,\\n                \\'-addext\\', \\'basicConstraints=critical,CA:FALSE\\',\\n                \\'-addext\\', \\'keyUsage=critical,keyEncipherment\\'], maximum_file=MAX_CERT)\\n        cert.chmod(0o600)\\n        pin, _ = inspect_certificate(cert)\\n        write_json(directory / \\'recipient-state.json\\', {\\'run_id\\': run_id, \\'run_attempt\\': run_attempt,\\n                                                       \\'certificate_sha256\\': pin})\\n        succeeded = True\\n        return pin\\n    finally:\\n        if not succeeded:\\n            remove_owned_tree(directory)\\n\\n\\ndef read_recipient(directory, run_id, run_attempt):\\n    identity(run_id, run_attempt)\\n    directory = Path(directory)\\n    private_directory(directory)\\n    require({x.name for x in directory.iterdir()} == RECIPIENT_FILES, \\'Unexpected recipient directory contents\\')\\n    cert, key = directory / \\'recipient.pem\\', directory / \\'recipient-key.pem\\'\\n    regular(key, MAX_KEY, private=True)\\n    regular(directory / \\'recipient-state.json\\', MAX_MANIFEST, private=True)\\n    state = load_json(directory / \\'recipient-state.json\\')\\n    require(set(state) == STATE_KEYS and state[\\'run_id\\'] == run_id and type(state[\\'run_attempt\\']) is int\\n            and state[\\'run_attempt\\'] == run_attempt, \\'Recipient belongs to another workflow run\\')\\n    pin, public_key = inspect_certificate(cert)\\n    require(state[\\'certificate_sha256\\'] == pin, \\'One-run recipient certificate changed\\')\\n    require(crypto([\\'pkey\\', \\'-in\\', key, \\'-pubout\\'], maximum_file=MAX_CERT) == public_key,\\n            \\'One-run recipient key mismatch\\')\\n    return cert, key\\n\\n\\ndef cleanup_recipient(directory, run_id, run_attempt):\\n    \"\"\"Call in signer\\'s final/always cleanup, including after failed decryption.\\n\\n    Successful prepare retains its key until this final cleanup. A failed prepare\\n    erases its partial directory immediately; decrypt never exposes the key.\\n    \"\"\"\\n    directory = Path(directory)\\n    identity(run_id, run_attempt)\\n    if not directory.exists() and not directory.is_symlink():\\n        return\\n    private_directory(directory)\\n    require({x.name for x in directory.iterdir()} <= RECIPIENT_FILES,\\n            \\'Unexpected recipient cleanup contents\\')\\n    state_path = directory / \\'recipient-state.json\\'\\n    require(state_path.exists() or not any(directory.iterdir()), \\'Recipient ownership state missing\\')\\n    if state_path.exists():\\n        state = load_json(state_path)\\n        require(set(state) == STATE_KEYS and state[\\'run_id\\'] == run_id\\n                and type(state[\\'run_attempt\\']) is int and state[\\'run_attempt\\'] == run_attempt,\\n                \\'Recipient cleanup belongs to another run\\')\\n    for name in (\\'recipient-key.pem\\', \\'recipient.pem\\', \\'recipient-state.json\\'):\\n        path = directory / name\\n        if path.exists() or path.is_symlink():\\n            require(not path.is_symlink(), \\'Unexpected recipient cleanup link\\')\\n            path.unlink()\\n    directory.rmdir()\\n    require(not directory.exists(), \\'Recipient cleanup unverified\\')\\n\\n\\ndef manifest_from_build(apk, facts_path, run_id, run_attempt, source, version):\\n    identity(run_id, run_attempt, source, version)\\n    regular(apk, MAX_APK)\\n    facts = load_json(facts_path)\\n    # These are build-host claims, not signer-attested provenance. The caller\\'s\\n    # artifact handshake and independent signer validation remain mandatory.\\n    require(facts.get(\\'source_commit\\') == source and type(facts.get(\\'version_code\\')) is int\\n            and facts[\\'version_code\\'] == version and facts.get(\\'container_destroyed\\') is True,\\n            \\'Build host facts do not match requested transfer\\')\\n    sha = digest(apk)\\n    require(facts.get(\\'unsigned_sha256\\') == sha, \\'Build host unsigned hash mismatch\\')\\n    return {\\'source_commit\\': source, \\'version_code\\': version, \\'package\\': PACKAGE,\\n            \\'unsigned_sha256\\': sha, \\'run_id\\': run_id, \\'run_attempt\\': run_attempt}\\n\\n\\ndef validate_manifest(value, apk, run_id, run_attempt, source, version):\\n    identity(run_id, run_attempt, source, version)\\n    require(isinstance(value, dict) and set(value) == MANIFEST_KEYS, \\'Unexpected unsigned manifest fields\\')\\n    require(value[\\'source_commit\\'] == source and value[\\'package\\'] == PACKAGE\\n            and type(value[\\'version_code\\']) is int and value[\\'version_code\\'] == version\\n            and value[\\'run_id\\'] == run_id and type(value[\\'run_attempt\\']) is int\\n            and value[\\'run_attempt\\'] == run_attempt, \\'Unsigned manifest workflow binding mismatch\\')\\n    require(isinstance(value[\\'unsigned_sha256\\'], str) and re.fullmatch(r\\'[a-f0-9]{64}\\', value[\\'unsigned_sha256\\'])\\n            and value[\\'unsigned_sha256\\'] == digest(apk), \\'Unsigned payload hash mismatch\\')\\n\\n\\ndef zip_info(name):\\n    info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))\\n    info.create_system = 3\\n    info.external_attr = (stat.S_IFREG | 0o600) << 16\\n    info.compress_type = zipfile.ZIP_STORED\\n    return info\\n\\n\\ndef encrypt(apk, facts_path, certificate, destination, *, run_id, run_attempt,\\n            source=SOURCE_SHA, version=VERSION_CODE):\\n    no_signing_secrets()\\n    os.umask(0o077)\\n    apk, certificate, destination = Path(apk), Path(certificate), Path(destination)\\n    identity(run_id, run_attempt, source, version)\\n    require(destination.name == \\'transfer.cms\\' and not destination.exists() and not destination.is_symlink(),\\n            \\'Unsigned ciphertext destination must be new transfer.cms\\')\\n    private_directory(destination.parent)\\n    inspect_certificate(certificate)\\n    manifest = manifest_from_build(apk, facts_path, run_id, run_attempt, source, version)\\n    body = json.dumps(manifest, sort_keys=True, separators=(\\',\\', \\':\\')).encode(\\'utf-8\\')\\n    require(len(body) <= MAX_MANIFEST)\\n    folder = Path(tempfile.mkdtemp(prefix=\\'.unsigned-encode-\\', dir=destination.parent))\\n    published = False\\n    try:\\n        payload, envelope = folder / \\'payload.zip\\', folder / \\'transfer.cms\\'\\n        with zipfile.ZipFile(payload, \\'x\\', compression=zipfile.ZIP_STORED, allowZip64=False) as archive:\\n            fd = os.open(apk, os.O_RDONLY | os.O_NOFOLLOW)\\n            with os.fdopen(fd, \\'rb\\') as source_file, archive.open(zip_info(\\'unsigned.apk\\'), \\'w\\', force_zip64=False) as target:\\n                state = os.fstat(source_file.fileno())\\n                require(stat.S_ISREG(state.st_mode) and state.st_nlink == 1 and 0 < state.st_size <= MAX_APK)\\n                total = 0\\n                packaged_hash = hashlib.sha256()\\n                for chunk in iter(lambda: source_file.read(65536), b\\'\\'):\\n                    total += len(chunk)\\n                    require(total <= MAX_APK)\\n                    packaged_hash.update(chunk)\\n                    target.write(chunk)\\n                require(total == state.st_size and packaged_hash.hexdigest() == manifest[\\'unsigned_sha256\\'],\\n                        \\'Unsigned input changed during packaging\\')\\n            archive.writestr(zip_info(\\'verification.json\\'), body)\\n        # Reject changes while packaging, before exporting any ciphertext.\\n        require(digest(apk) == manifest[\\'unsigned_sha256\\'], \\'Unsigned input changed during packaging\\')\\n        regular(payload, MAX_ZIP)\\n        crypto([\\'cms\\', \\'-encrypt\\', \\'-binary\\', \\'-aes-256-gcm\\', \\'-in\\', payload,\\n                \\'-outform\\', \\'DER\\', \\'-out\\', envelope, \\'-recip\\', certificate,\\n                \\'-keyopt\\', \\'rsa_padding_mode:oaep\\', \\'-keyopt\\', \\'rsa_oaep_md:sha256\\',\\n                \\'-keyopt\\', \\'rsa_mgf1_md:sha256\\'], maximum_file=MAX_CIPHERTEXT)\\n        regular(envelope, MAX_CIPHERTEXT)\\n        inspect_envelope(envelope)\\n        # Remove encoded plaintext before the exact uploadable name can appear.\\n        payload.unlink()\\n        require(not payload.exists())\\n        result = digest(envelope)\\n        os.link(envelope, destination)\\n        published = True\\n        envelope.unlink()\\n        folder.rmdir()\\n        regular(destination, MAX_CIPHERTEXT, private=True)\\n        return result\\n    except BaseException:\\n        if published and destination.exists():\\n            destination.unlink()\\n        raise\\n    finally:\\n        remove_owned_tree(folder)\\n\\n\\ndef validate_outer_zip(path):\\n    \"\"\"Bound central-directory allocation before invoking Python\\'s ZIP parser.\"\"\"\\n    info = regular(path, MAX_ZIP)\\n    require(info.st_size >= 22)\\n    with open(path, \\'rb\\') as stream:\\n        stream.seek(-22, os.SEEK_END)\\n        end = stream.read(22)\\n    signature, disk, central_disk, count_disk, count, size, offset, comment = struct.unpack(\\'<4sHHHHIIH\\', end)\\n    require(signature == b\\'PK\\\\x05\\\\x06\\' and disk == central_disk == 0\\n            and count_disk == count == 2 and comment == 0\\n            and size == sum(46 + len(name) for name in ENTRIES)\\n            and offset + size + 22 == info.st_size, \\'Unexpected unsigned ZIP layout\\')\\n    with zipfile.ZipFile(path) as archive:\\n        entries = archive.infolist()\\n        require(len(entries) == 2 and [item.filename for item in entries] == list(ENTRIES)\\n                and archive.comment == b\\'\\' and archive.start_dir == offset,\\n                \\'Unexpected unsigned ZIP members\\')\\n        next_offset = 0\\n        for item in entries:\\n            limit = MAX_APK if item.filename == \\'unsigned.apk\\' else MAX_MANIFEST\\n            require(item.orig_filename == item.filename and item.header_offset == next_offset\\n                    and 0 < item.file_size <= limit and item.compress_size == item.file_size\\n                    and item.compress_type == zipfile.ZIP_STORED and item.flag_bits == 0\\n                    and item.create_system == 3 and stat.S_IFMT(item.external_attr >> 16) == stat.S_IFREG\\n                    and not item.is_dir() and item.extra == item.comment == b\\'\\' and item.volume == 0,\\n                    \\'Unsafe unsigned ZIP member\\')\\n            with open(path, \\'rb\\') as stream:\\n                stream.seek(item.header_offset)\\n                local = stream.read(30)\\n                require(len(local) == 30)\\n                header = struct.unpack(\\'<4sHHHHHIIIHH\\', local)\\n                require(header[0] == b\\'PK\\\\x03\\\\x04\\' and header[2] == 0 and header[3] == 0\\n                        and header[6] == item.CRC and header[7] == item.compress_size\\n                        and header[8] == item.file_size and header[9] == len(item.filename)\\n                        and header[10] == 0 and stream.read(header[9]) == item.filename.encode(\\'ascii\\'),\\n                        \\'Unsigned ZIP local header mismatch\\')\\n            next_offset += 30 + len(item.filename) + item.file_size\\n        require(next_offset == offset, \\'Unsigned ZIP has extra local data\\')\\n    return entries\\n\\n\\ndef decrypt(envelope, recipient_directory, destination, *, expected_ciphertext_sha256,\\n            run_id, run_attempt, source=SOURCE_SHA, version=VERSION_CODE):\\n    no_signing_secrets()\\n    os.umask(0o077)\\n    identity(run_id, run_attempt, source, version)\\n    envelope, destination = Path(envelope), Path(destination)\\n    require(not destination.exists() and not destination.is_symlink(), \\'Unsigned decode destination already exists\\')\\n    private_directory(destination.parent)\\n    regular(envelope, MAX_CIPHERTEXT)\\n    require(isinstance(expected_ciphertext_sha256, str) and re.fullmatch(r\\'[a-f0-9]{64}\\', expected_ciphertext_sha256)\\n            and digest(envelope) == expected_ciphertext_sha256, \\'Ciphertext does not match caller-verified artifact\\')\\n    inspect_envelope(envelope)\\n    cert, key = read_recipient(recipient_directory, run_id, run_attempt)\\n    folder = Path(tempfile.mkdtemp(prefix=\\'.unsigned-decode-\\', dir=destination.parent))\\n    published = False\\n    try:\\n        payload = folder / \\'payload.zip\\'\\n        # Failed GCM may leave bytes. They stay private and are deleted on failure.\\n        crypto([\\'cms\\', \\'-decrypt\\', \\'-binary\\', \\'-inform\\', \\'DER\\', \\'-in\\', envelope,\\n                \\'-recip\\', cert, \\'-inkey\\', key, \\'-out\\', payload], maximum_file=MAX_ZIP)\\n        validate_outer_zip(payload)\\n        ready = folder / \\'ready\\'\\n        ready.mkdir(mode=0o700)\\n        apk = ready / \\'unsigned.apk\\'\\n        with zipfile.ZipFile(payload) as archive:\\n            with archive.open(\\'unsigned.apk\\') as source_file, open(apk, \\'xb\\') as target:\\n                total = 0\\n                for chunk in iter(lambda: source_file.read(65536), b\\'\\'):\\n                    total += len(chunk)\\n                    require(total <= MAX_APK)\\n                    target.write(chunk)\\n                require(total == archive.getinfo(\\'unsigned.apk\\').file_size)\\n            manifest_bytes = archive.read(\\'verification.json\\')\\n        manifest = json.loads(manifest_bytes, object_pairs_hook=unique_object)\\n        validate_manifest(manifest, apk, run_id, run_attempt, source, version)\\n        # These facts say only that transport was authenticated and matched the\\n        # caller\\'s expected run. They do not claim source derivation, ABI/minSdk,\\n        # Android signature status, builder destruction or APK safety.\\n        facts = {**manifest, \\'transport_authenticated\\': True,\\n                 \\'transfer_ciphertext_sha256\\': expected_ciphertext_sha256}\\n        write_json(ready / \\'host-facts.json\\', facts)\\n        payload.unlink()\\n        require(not payload.exists())\\n        destination.mkdir(mode=0o700, exist_ok=False)\\n        published = True\\n        for name in (\\'unsigned.apk\\', \\'host-facts.json\\'):\\n            os.link(ready / name, destination / name)\\n            (ready / name).unlink()\\n        ready.rmdir()\\n        folder.rmdir()\\n        return destination / \\'unsigned.apk\\'\\n    except BaseException:\\n        if published:\\n            remove_owned_tree(destination)\\n        raise\\n    finally:\\n        remove_owned_tree(folder)\\n\\n\\ndef main():\\n    class QuietParser(argparse.ArgumentParser):\\n        def error(self, message):\\n            raise TransferError(\\'Invalid unsigned transfer arguments\\')\\n    parser = QuietParser(description=\\'One-run unsigned transport; no Android signing or upload\\')\\n    commands = parser.add_subparsers(dest=\\'command\\', required=True)\\n    prepare = commands.add_parser(\\'prepare-recipient\\')\\n    prepare.add_argument(\\'--directory\\', required=True)\\n    encode = commands.add_parser(\\'encrypt\\')\\n    encode.add_argument(\\'--apk\\', required=True)\\n    encode.add_argument(\\'--build-facts\\', required=True)\\n    encode.add_argument(\\'--certificate\\', required=True)\\n    encode.add_argument(\\'--output\\', required=True)\\n    decode = commands.add_parser(\\'decrypt\\')\\n    decode.add_argument(\\'--envelope\\', required=True)\\n    decode.add_argument(\\'--ciphertext-sha256\\', required=True)\\n    decode.add_argument(\\'--recipient-directory\\', required=True)\\n    decode.add_argument(\\'--output-directory\\', required=True)\\n    for sub in (prepare, encode, decode):\\n        sub.add_argument(\\'--run-id\\', required=True)\\n        sub.add_argument(\\'--run-attempt\\', type=int, required=True)\\n    for sub in (encode, decode):\\n        sub.add_argument(\\'--source\\', default=SOURCE_SHA)\\n        sub.add_argument(\\'--version\\', type=int, default=VERSION_CODE)\\n    args = parser.parse_args()\\n    resource.setrlimit(resource.RLIMIT_CORE, (0, 0))\\n    common = {\\'run_id\\': args.run_id, \\'run_attempt\\': args.run_attempt}\\n    if args.command == \\'prepare-recipient\\':\\n        prepare_recipient(args.directory, **common)\\n        print(\\'PASS: one-run public recipient prepared\\')\\n    elif args.command == \\'encrypt\\':\\n        encrypt(args.apk, args.build_facts, args.certificate, args.output,\\n                source=args.source, version=args.version, **common)\\n        print(\\'PASS: unsigned transfer encrypted; no upload performed\\')\\n    else:\\n        decrypt(args.envelope, args.recipient_directory, args.output_directory,\\n                expected_ciphertext_sha256=args.ciphertext_sha256,\\n                source=args.source, version=args.version, **common)\\n        print(\\'PASS: unsigned transfer authenticated; independent APK validation required\\')\\n\\n\\nif __name__ == \\'__main__\\':\\n    try:\\n        main()\\n    except BaseException:\\n        raise SystemExit(\\'FAIL: unsigned_transfer_failed; no signing or upload permitted\\')\\n')\n(root/'private_delivery.py').write_text('\"\"\"Private APK transport. No upload, workflow edits, Android signing or fallback.\\nCMS ciphertext only leaves the host; recipient private key stays on local computer.\\n\"\"\"\\nimport argparse\\nimport hashlib\\nimport json\\nimport os\\nimport mmap\\nfrom pathlib import Path\\nimport re\\nimport resource\\nimport stat\\nimport subprocess\\nimport tempfile\\nimport zipfile\\n\\nMAX_APK = 512 * 1024**2\\nMAX_MANIFEST = 16 * 1024\\nMAX_ENVELOPE = MAX_APK + 1024**2\\nNAMES = {\\'app.apk\\', \\'verification.json\\'}\\nPACKAGE = \\'org.personal.jellyfinmobile.dev\\'\\nSIGNER_PIN = \\'609575df8914c682d894bf397ed867a6a59f49ac6d090e52b92a738d87c41764\\'\\n\\n\\ndef require(value, message):\\n    if not value: raise ValueError(message)\\n\\n\\ndef run(args, timeout=180, address_limit=None):\\n    def constrain_address_space():\\n        resource.setrlimit(resource.RLIMIT_AS, (address_limit, address_limit))\\n    result = subprocess.run([str(x) for x in args], capture_output=True, timeout=timeout,\\n                            preexec_fn=constrain_address_space if address_limit else None,\\n                            env={\\'PATH\\': \\'/usr/bin:/bin\\', \\'LANG\\': \\'C.UTF-8\\', \\'LC_ALL\\': \\'C.UTF-8\\',\\n                                 **({\\'JAVA_HOME\\': os.environ[\\'JAVA_HOME\\']} if \\'JAVA_HOME\\' in os.environ else {})})\\n    require(result.returncode == 0, \\'Cryptographic or verification operation failed; diagnostics suppressed\\')\\n    return result.stdout\\n\\n\\ndef regular(path, limit):\\n    info = Path(path).lstat()\\n    require(stat.S_ISREG(info.st_mode) and 0 < info.st_size <= limit, \\'Unexpected file type or size\\')\\n\\n\\ndef digest(path):\\n    h = hashlib.sha256()\\n    with open(path, \\'rb\\') as stream:\\n        for chunk in iter(lambda: stream.read(65536), b\\'\\'): h.update(chunk)\\n    return h.hexdigest()\\n\\n\\ndef create_recipient(directory):\\n    \"\"\"Only run locally with explicit authorization. Directory must not exist.\"\"\"\\n    os.umask(0o077)\\n    directory = Path(directory).resolve()\\n    application_repository = Path(__file__).resolve().parents[3]\\n    require(directory != application_repository and application_repository not in directory.parents,\\n            \\'Recipient key directory must be outside the application repository\\')\\n    directory.mkdir(mode=0o700, exist_ok=False)\\n    key, cert = directory/\\'recipient-key.pem\\', directory/\\'recipient-cert.pem\\'\\n    run([\\'openssl\\', \\'req\\', \\'-x509\\', \\'-newkey\\', \\'rsa:4096\\', \\'-sha256\\', \\'-nodes\\',\\n         \\'-keyout\\', key, \\'-out\\', cert, \\'-days\\', \\'7\\', \\'-subj\\', \\'/CN=Private APK Transfer\\',\\n         \\'-addext\\', \\'basicConstraints=critical,CA:FALSE\\', \\'-addext\\', \\'keyUsage=critical,keyEncipherment\\'])\\n    key.chmod(0o600)\\n    cert.chmod(0o600)\\n    der = run([\\'openssl\\', \\'x509\\', \\'-in\\', cert, \\'-outform\\', \\'DER\\'])\\n    pin = hashlib.sha256(der).hexdigest()\\n    (directory/\\'recipient-cert-sha256.txt\\').write_text(pin+\\'\\\\n\\')\\n    return pin\\n\\n\\ndef certificate_pin(cert):\\n    regular(cert, 16384)\\n    return hashlib.sha256(run([\\'openssl\\', \\'x509\\', \\'-in\\', cert, \\'-outform\\', \\'DER\\'])).hexdigest()\\n\\n\\n# Strict bounded DER reader: skip ciphertext contents without a giant ASN.1 diagnostic dump.\\ndef tlv(data, offset, bound):\\n    require(offset+2 <= bound, \\'Truncated DER\\')\\n    tag, first = data[offset], data[offset+1]\\n    start = offset+2\\n    if first & 128:\\n        n = first & 127\\n        require(1 <= n <= 4 and start+n <= bound and data[start] != 0, \\'Noncanonical DER length\\')\\n        length = int.from_bytes(data[start:start+n], \\'big\\'); start += n\\n        require(length >= 128, \\'Noncanonical DER length\\')\\n    else: length = first\\n    end = start+length\\n    require(end <= bound, \\'Truncated DER value\\')\\n    return tag, start, end\\n\\n\\ndef children(data, node):\\n    _, start, end = node\\n    result = []\\n    while start < end:\\n        value = tlv(data, start, end); result.append(value); start = value[2]\\n        require(len(result) <= 16, \\'Unexpected ASN.1 member count\\')\\n    return result\\n\\n\\ndef oid(data, node, hex_value):\\n    return node[0] == 6 and data[node[1]:node[2]] == bytes.fromhex(hex_value)\\n\\n\\ndef algorithm(data, node, expected):\\n    require(node[0] == 0x30, \\'Expected algorithm sequence\\')\\n    parts = children(data, node)\\n    require(parts and oid(data, parts[0], expected), \\'Unexpected algorithm\\')\\n    return parts\\n\\n\\ndef inspect_envelope(path):\\n    regular(path, MAX_ENVELOPE)\\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\\n    with os.fdopen(fd, \\'rb\\') as stream:\\n        info = os.fstat(stream.fileno())\\n        require(stat.S_ISREG(info.st_mode) and 0 < info.st_size <= MAX_ENVELOPE, \\'Unexpected envelope type or size\\')\\n        with mmap.mmap(stream.fileno(), 0, access=mmap.ACCESS_READ) as data:\\n            return inspect_der(data)\\n\\n\\ndef inspect_der(data):\\n    # Header-only random access: never copy the potentially 512MiB ciphertext body.\\n    top = tlv(data, 0, len(data))\\n    require(top[0] == 0x30 and top[2] == len(data), \\'Trailing or malformed CMS data\\')\\n    content = children(data, top)\\n    require(len(content) == 2 and oid(data, content[0], \\'2a864886f70d0109100117\\') and content[1][0] == 0xa0,\\n            \\'Expected AuthEnvelopedData\\')\\n    wrapped = children(data, content[1]); require(len(wrapped) == 1 and wrapped[0][0] == 0x30, \\'Bad CMS wrapper\\')\\n    auth = children(data, wrapped[0])\\n    require(len(auth) == 4 and auth[0][0] == 2 and data[auth[0][1]:auth[0][2]] == b\\'\\\\0\\', \\'Unexpected AuthEnvelopedData layout\\')\\n    require(auth[1][0] == 0x31, \\'Expected recipient SET\\')\\n    recipients = children(data, auth[1]); require(len(recipients) == 1 and recipients[0][0] == 0x30, \\'Expected one key-transport recipient\\')\\n    recipient = children(data, recipients[0]); require(len(recipient) == 4 and recipient[0][0] == 2 and recipient[1][0] == 0x30 and recipient[3][0] == 4, \\'Unexpected recipient layout\\')\\n    require(recipient[3][2]-recipient[3][1] == 512, \\'Expected RSA4096 encrypted key\\')\\n    oaep = algorithm(data, recipient[2], \\'2a864886f70d010107\\')\\n    require(len(oaep) == 2 and oaep[1][0] == 0x30, \\'Missing OAEP parameters\\')\\n    params = children(data, oaep[1]); require([x[0] for x in params] == [0xa0, 0xa1], \\'Unexpected OAEP defaults/parameters\\')\\n    sha = children(data, params[0]); require(len(sha) == 1, \\'Bad OAEP hash\\')\\n    algorithm(data, sha[0], \\'608648016503040201\\')\\n    mgf = children(data, params[1]); require(len(mgf) == 1, \\'Bad MGF parameters\\')\\n    mgf_parts = algorithm(data, mgf[0], \\'2a864886f70d010108\\')\\n    require(len(mgf_parts) == 2, \\'Missing MGF1 hash\\')\\n    algorithm(data, mgf_parts[1], \\'608648016503040201\\')\\n    encrypted = children(data, auth[2]); require(auth[2][0] == 0x30 and len(encrypted) == 3 and oid(data, encrypted[0], \\'2a864886f70d010701\\') and encrypted[2][0] == 0x80, \\'Unexpected encrypted-content layout\\')\\n    aes = algorithm(data, encrypted[1], \\'60864801650304012e\\')\\n    require(len(aes) == 2 and aes[1][0] == 0x30, \\'Missing GCM parameters\\')\\n    gcm = children(data, aes[1]); require(1 <= len(gcm) <= 2 and gcm[0][0] == 4 and gcm[0][2]-gcm[0][1] == 12, \\'Unexpected GCM nonce\\')\\n    tag_length = 12 if len(gcm) == 1 else int.from_bytes(data[gcm[1][1]:gcm[1][2]], \\'big\\')\\n    require(tag_length == 16 and (len(gcm) == 1 or gcm[1][0] == 2) and auth[3][0] == 4 and auth[3][2]-auth[3][1] == 16, \\'Expected 128-bit GCM tag\\')\\n    return {\\'ciphertext\\': encrypted[2][1:3], \\'tag\\': auth[3][1:3]}\\n\\n\\ndef unique_object(pairs):\\n    output = {}\\n    for key, value in pairs:\\n        require(key not in output, \\'Duplicate JSON key\\')\\n        output[key] = value\\n    return output\\n\\n\\ndef validate_manifest(manifest, apk, expected_source, expected_version):\\n    require(type(expected_version) is int and 1 <= expected_version <= 2100000000, \\'Invalid expected version\\')\\n    require(set(manifest) == {\\'source_commit\\', \\'package\\', \\'version_code\\', \\'apk_sha256\\', \\'signing_certificate_sha256\\'}, \\'Unexpected manifest fields\\')\\n    require(re.fullmatch(\\'[a-f0-9]{40}\\', expected_source) and manifest[\\'source_commit\\'] == expected_source, \\'Unexpected source revision\\')\\n    require(manifest[\\'package\\'] == PACKAGE and type(manifest[\\'version_code\\']) is int and manifest[\\'version_code\\'] == expected_version, \\'Unexpected package/version\\')\\n    require(manifest[\\'signing_certificate_sha256\\'] == SIGNER_PIN and manifest[\\'apk_sha256\\'] == digest(apk), \\'APK/signing fingerprint mismatch\\')\\n\\n\\ndef encrypt(apk, manifest, cert, expected_recipient_pin, destination):\\n    os.umask(0o077)\\n    require(not any(name.startswith(\\'ANDROID_KEY\\') for name in os.environ), \\'Signing credentials must be removed before transport encryption\\')\\n    regular(apk, MAX