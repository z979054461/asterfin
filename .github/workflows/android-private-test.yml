     if process.stdout is not None:\\n            os.set_blocking(process.stdout.fileno(), False)\\n            selector.register(process.stdout, selectors.EVENT_READ, \\'output\\')\\n        if process.stdin is not None:\\n            os.set_blocking(process.stdin.fileno(), False)\\n            if input_bytes:\\n                selector.register(process.stdin, selectors.EVENT_WRITE, \\'input\\')\\n            else:\\n                process.stdin.close()\\n        deadline = time.monotonic() + timeout\\n        while selector.get_map() or process.poll() is None:\\n            remaining = deadline-time.monotonic()\\n            if remaining <= 0: raise TimeoutError(\\'Operation deadline\\')\\n            if shutil.disk_usage(root).free < MIN_FREE_BYTES: raise RuntimeError(\\'Disk reserve reached\\')\\n            for key, event in selector.select(min(0.2, remaining)):\\n                if key.data == \\'input\\':\\n                    try:\\n                        sent += os.write(key.fd, input_bytes[sent:sent+8192])\\n                    except BrokenPipeError:\\n                        selector.unregister(key.fileobj); key.fileobj.close()\\n                        continue\\n                    if sent == len(input_bytes):\\n                        selector.unregister(key.fileobj); key.fileobj.close()\\n                else:\\n                    chunk = os.read(key.fd, 65536)\\n                    if not chunk:\\n                        selector.unregister(key.fileobj); key.fileobj.close()\\n                        continue\\n                    available = MAX_PRIVATE_LOG_BYTES-total\\n                    if available:\\n                        log.write(chunk[:available]); total += min(len(chunk), available)\\n                    if len(chunk) > available:\\n                        raise RuntimeError(\\'Private log limit exceeded\\')\\n        if process.wait(timeout=10) or (input_bytes is not None and sent != len(input_bytes)):\\n            raise RuntimeError(\\'Operation failed; private diagnostics retained\\')\\n    finally:\\n        if process is not None:\\n            if process.poll() is None:\\n                process.kill()\\n                process.wait(timeout=10)\\n            for stream in (process.stdin, process.stdout):\\n                if stream is not None and not stream.closed: stream.close()\\n        selector.close()\\n        if log is not None: log.close()\\n\\n\\ndef container_args(cid, image):\\n    return [\\'docker\\', \\'create\\', \\'--name\\', cid, \\'--user=10001:10001\\', \\'--read-only\\', \\'--cap-drop=ALL\\',\\n            \\'--security-opt=no-new-privileges:true\\', \\'--pids-limit=768\\', \\'--memory=10g\\', \\'--cpus=2\\',\\n            \\'--ulimit=nofile=65536:65536\\', \\'--network=bridge\\', \\'--log-driver=none\\', \\'--ipc=private\\', \\'--cgroupns=private\\',\\n            \\'--tmpfs=/tmp:rw,nosuid,nodev,size=2g,uid=10001,gid=10001\\',\\n            \\'--mount=type=volume,source=\\'+cid+\\'-work,destination=/work\\',\\n            \\'--env=HOME=/work/home\\', \\'--env=SOURCE_SHA=\\'+SOURCE_SHA, \\'--env=VERSION_CODE=\\'+str(VERSION_CODE),\\n            \\'--env=PATH=/opt/bun:/opt/java/bin:/opt/android-sdk/platform-tools:/usr/bin:/bin\\',\\n            \\'--env=JAVA_HOME=/opt/java\\', \\'--env=ANDROID_HOME=/opt/android-sdk\\', \\'--env=ANDROID_SDK_ROOT=/opt/android-sdk\\',\\n            \\'--entrypoint=/bin/bash\\', image, \\'-c\\', \\'exec /usr/bin/sleep 3600\\']\\n\\n\\ndef validate_container(info, cid):\\n    host, config = info[\\'HostConfig\\'], info[\\'Config\\']\\n    if (config[\\'User\\'] != \\'10001:10001\\' or not host[\\'ReadonlyRootfs\\'] or host[\\'Privileged\\']\\n            or host.get(\\'Binds\\') or host.get(\\'VolumesFrom\\') or host.get(\\'Devices\\')\\n            or host[\\'NetworkMode\\'] != \\'bridge\\' or host.get(\\'PidMode\\', \\'\\') not in (\\'\\', \\'private\\')\\n            or host[\\'IpcMode\\'] != \\'private\\' or host[\\'CgroupnsMode\\'] != \\'private\\'\\n            or host[\\'LogConfig\\'][\\'Type\\'] != \\'none\\' or host[\\'CapDrop\\'] != [\\'ALL\\']\\n            or host.get(\\'CapAdd\\') or \\'no-new-privileges:true\\' not in host[\\'SecurityOpt\\']\\n            or set(host.get(\\'Tmpfs\\', {})) != {\\'/tmp\\'}\\n            or host[\\'PidsLimit\\'] != 768 or host[\\'Memory\\'] != 10 * 1024**3 or host[\\'NanoCpus\\'] != 2_000_000_000):\\n        raise RuntimeError(\\'Unexpected container isolation settings\\')\\n    volumes = {}\\n    for mount in info[\\'Mounts\\']:\\n        if mount[\\'Type\\'] == \\'tmpfs\\' and mount[\\'Destination\\'] == \\'/tmp\\': continue\\n        if mount[\\'Type\\'] != \\'volume\\' or mount[\\'Destination\\'] in volumes:\\n            raise RuntimeError(\\'Unexpected mount\\')\\n        volumes[mount[\\'Destination\\']] = mount[\\'Name\\']\\n    if volumes != {\\'/work\\': cid+\\'-work\\'}:\\n        raise RuntimeError(\\'Unexpected volume mapping\\')\\n    allowed = {\\'PATH\\', \\'HOME\\', \\'SOURCE_SHA\\', \\'VERSION_CODE\\', \\'JAVA_HOME\\', \\'ANDROID_HOME\\', \\'ANDROID_SDK_ROOT\\'}\\n    if any(item.split(\\'=\\', 1)[0] not in allowed for item in config[\\'Env\\']):\\n        raise RuntimeError(\\'Unexpected container environment\\')\\n\\n\\ndef copy_pending(cid, root):\\n    process = subprocess.Popen(docker_args([\\'docker\\', \\'cp\\', cid+\\':\\'+APK_PATH, \\'-\\']), stdout=subprocess.PIPE,\\n                               stderr=subprocess.DEVNULL)\\n    try:\\n        with transfer_deadline(120):\\n            receive(process.stdout, root/\\'.unsigned-pending.apk\\')\\n            if process.wait(timeout=30): raise RuntimeError(\\'Transfer failed\\')\\n    finally:\\n        if process.poll() is None:\\n            process.kill()\\n            process.wait(timeout=10)\\n\\n\\ndef finalize(root):\\n    pending = root/\\'.unsigned-pending.apk\\'\\n    h = hashlib.sha256()\\n    with pending.open(\\'rb\\') as stream:\\n        for chunk in iter(lambda: str