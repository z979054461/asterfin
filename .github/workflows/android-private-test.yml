tination.exists() and not destination.is_symlink(), \\'Decoded destination already exists\\')\\n    with tempfile.TemporaryDirectory(prefix=\\'private-decode-\\', dir=destination.parent) as folder:\\n        folder = Path(folder); payload = folder/\\'payload.zip\\'; apk = folder/\\'app.apk\\'\\n        # Failed GCM authentication may write bytes, but only to a private temporary file.\\n        run([\\'openssl\\', \\'cms\\', \\'-decrypt\\', \\'-binary\\', \\'-inform\\', \\'DER\\', \\'-in\\', envelope,\\n             \\'-recip\\', cert, \\'-inkey\\', key, \\'-out\\', payload], address_limit=4 * 1024**3)\\n        regular(payload, MAX_ENVELOPE)\\n        with zipfile.ZipFile(payload) as archive:\\n            infos = archive.infolist()\\n            require(len(infos) == 2 and {item.filename for item in infos} == NAMES, \\'Unexpected ZIP entries\\')\\n            for item in infos:\\n                limit = MAX_APK if item.filename == \\'app.apk\\' else MAX_MANIFEST\\n                require(0 < item.file_size <= limit and item.compress_type == zipfile.ZIP_STORED and not item.flag_bits & 1\\n                        and not item.is_dir() and stat.S_IFMT(item.external_attr >> 16) in (0, stat.S_IFREG), \\'Unsafe ZIP entry\\')\\n            with archive.open(\\'app.apk\\') as source, open(apk, \\'xb\\') as out:\\n                total = 0\\n                for chunk in iter(lambda: source.read(65536), b\\'\\'):\\n                    total += len(chunk); require(total <= MAX_APK, \\'APK expansion exceeds bound\\'); out.write(chunk)\\n            manifest = json.loads(archive.read(\\'verification.json\\'), object_pairs_hook=unique_object)\\n        validate_manifest(manifest, apk, expected_source, expected_version)\\n        require(callable(verify_apk), \\'Independent Android signature validation hook required\\')\\n        require(verify_apk(apk, manifest) is True, \\'Independent Android signature validation failed\\')\\n        destination.mkdir(mode=0o700, exist_ok=False)\\n        os.rename(apk, destination/\\'app.apk\\')\\n        (destination/\\'verification.json\\').write_text(json.dumps(manifest, sort_keys=True)+\\'\\\\n\\')\\n    return destination/\\'app.apk\\'\\n\\n\\n\\ndef extract_ciphertext_artifact(archive_path, destination):\\n    \"\"\"Decode only the expected outer GitHub artifact member, never general ZIP paths.\"\"\"\\n    os.umask(0o077)\\n    regular(archive_path, MAX_ENVELOPE + 1024**2)\\n    destination = Path(destination)\\n    require(not destination.exists() and not destination.is_symlink(), \\'Ciphertext destination exists\\')\\n    with tempfile.TemporaryDirectory(prefix=\\'artifact-decode-\\', dir=destination.parent) as folder:\\n        output = Path(folder)/\\'delivery.cms\\'\\n        with zipfile.ZipFile(archive_path) as archive:\\n            infos = archive.infolist()\\n            require(len(infos) == 1, \\'Unexpected artifact members\\')\\n            info = infos[0]\\n            require(info.filename == \\'delivery.cms\\' and not info.is_dir()\\n                    and 0 < info.file_size <= MAX_ENVELOPE\\n                    and info.compress_type in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED)\\n                    and not info.flag_bits & 1\\n                    and stat.S_IFMT(info.external_attr >> 16) in (0, stat.S_IFREG), \\'Unsafe artifact member\\')\\n            with archive.open(info) as source, open(output, \\'xb\\') as target:\\n                total = 0\\n                for chunk in iter(lambda: source.read(65536), b\\'\\'):\\n                    total += len(chunk)\\n                    require(total <= MAX_ENVELOPE, \\'Artifact expands beyond bound\\')\\n                    target.write(chunk)\\n                require(total == info.file_size, \\'Truncated artifact member\\')\\n        inspect_envelope(output)\\n        os.link(output, destination)\\n    return digest(destination)\\n\\n\\ndef android_validator(build_tools):\\n    \"\"\"Required independent local signature/identity check using preinstalled trusted SDK.\\n    No SDK download/install occurs here. No certificate fields or tool output are printed.\\n    \"\"\"\\n    tools = Path(build_tools).resolve()\\n    for name in (\\'apksigner\\', \\'aapt\\', \\'zipalign\\'):\\n        require((tools/name).is_file(), \\'Required trusted Android verifier unavailable\\')\\n    def verify(apk, manifest):\\n        result = run([tools/\\'apksigner\\', \\'verify\\', \\'--verbose\\', \\'--print-certs\\', apk]).decode(\\'utf-8\\', errors=\\'strict\\')\\n        require(\\'Number of signers: 1\\' in result, \\'Expected one APK signer\\')\\n        for version in (\\'v2\\', \\'v3\\'):\\n            require(f\\'Verified using {version} scheme (APK Signature Scheme {version}): true\\' in result,\\n                    \\'Required APK signature scheme absent\\')\\n        pins = re.findall(r\\'^Signer #\\\\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)$\\', result, re.M)\\n        require([pin.lower() for pin in pins] == [SIGNER_PIN], \\'APK signer fingerprint mismatch\\')\\n        info = run([tools/\\'aapt\\', \\'dump\\', \\'badging\\', apk]).decode(\\'utf-8\\', errors=\\'strict\\')\\n        require(f\"package: name=\\'{PACKAGE}\\' versionCode=\\'{manifest[\\'version_code\\']}\\'\" in info\\n                and \\'application-debuggable\\' not in info, \\'APK package/version/debug status mismatch\\')\\n        run([tools/\\'zipalign\\', \\'-c\\', \\'-P\\', \\'16\\', \\'4\\', apk])\\n        return True\\n    return verify\\n\\n\\ndef encrypt_host_result(signing_root, cert, pin, destination):\\n    \"\"\"Run only after signing temp cleanup; emits solely an exact ciphertext file.\"\"\"\\n    root = Path(signing_root)\\n    require(not any(root.glob(\\'android-signing-*\\')), \\'Signing temporary material remains\\')\\n    host = json.loads((root/\\'signed-output/signed-manifest.json\\').read_text(), object_pairs_hook=unique_object)\\n    version = host[\\'version_code\\']\\n    require(type(version) is int and 1 <= version <= 2100000000, \\'Invalid host version\\')\\n    apk = root/\\'signed-output\\'/f\\'jellyfin-mobile-dev-{version}-arm64.apk\\'\\n    manifest = {\\'source_commit\\': host[\\'source_commit\\'], \\'package\\': PACKAGE, \\'version_code\\': version,\\n                \\'apk_sha256\\': host[\\'signed_sha256\\'], \\'signing_certificate_sha256\\': host[\\'signing_certificate_sha256\\']}\\n    return encrypt(apk, manifest, cert, pin, destination)\\n\\n\\ndef main():\\n    parser = argparse.ArgumentParser(description=\\'Private CMS transport; no uploads or APK signing\\')\\n    commands = parser.add_subparsers(dest=\\'command\\', required=True)\\n    encode = commands.add_parser(\\'encrypt-host-result\\')\\n    encode.add_argument(\\'--signing-root\\', required=True)\\n    decode = commands.add_parser(\\'decrypt\\')\\n    decode.add_argument(\\'--envelope\\', required=True)\\n    decode.add_argument(\\'--envelope-sha256\\', required=True)\\n    decode.add_argument(\\'--key\\', required=True)\\n    decode.add_argument(\\'--source\\', required=True)\\n    decode.add_argument(\\'--version\\', type=int, required=True)\\n    decode.add_argument(\\'--android-build-tools\\', required=True)\\n    for sub in (encode, decode):\\n        sub.add_argument(\\'--certificate\\', required=True)\\n        sub.add_argument(\\'--certificate-pin\\', required=True)\\n        sub.add_argument(\\'--output\\', required=True)\\n    args = parser.parse_args()\\n    if args.command == \\'encrypt-host-result\\':\\n        encrypt_host_result(args.signing_root, args.certificate, args.certificate_pin, args.output)\\n        print(\\'Authenticated ciphertext prepared; no upload performed.\\')\\n    else:\\n        require(re.fullmatch(\\'[a-f0-9]{64}\\', args.envelope_sha256) and digest(args.envelope) == args.envelope_sha256,\\n                \\'Downloaded ciphertext does not match the trusted run digest\\')\\n        decrypt(args.envelope, args.certificate, args.key, args.certificate