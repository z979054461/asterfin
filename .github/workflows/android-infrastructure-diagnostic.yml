          if [ -f "$RUNNER_TEMP/jfm-infra-probe/cleanup_network.py" ]; then
            python3 "$RUNNER_TEMP/jfm-infra-probe/cleanup_network.py" || cleanup_status=$?
          fi
          if [ "$cleanup_status" -eq 0 ]; then
