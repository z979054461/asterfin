                              (\\'container.id\\', r\\'jfm-isolated-[a-f0-9]{32}\\')):\\n        path = Path(root) / filename\\n        if not path.exists() and not path.is_symlink():\\n            continue\\n        if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode):\\n            raise RuntimeError(\\'Invalid exact resource cleanup record\\')\\n        value = path.read_text().strip()\\n        if not re.fullmatch(pattern, value):\\n            raise RuntimeError(\\'Invalid exact resource cleanup record\\')\\n        containers.add(value)\\n        volumes.update((value + \\'-work\\', value + \\'-sdk\\'))\\n    for expected, args in ((containers, [\\'docker\\', \\'container\\', \\'ls\\', \\'--all\\', \\'--no-trunc\\', \\'--format\\', \\'{{json .Names}}\\']),\\n                           (volumes, [\\'docker\\', \\'volume\\', \\'ls\\', \\'--format\\', \\'{{json .Name}}\\'])):\\n        if not expected:\\n            continue\\n        result = command(docker_args(args))\\n        observed = []\\n        for row in result.splitlines():\\n            value = json.loads(row)\\n            if not isinstance(value, str) or not re.fullmatch(r\\'[A-Za-z0-9][A-Za-z0-9_.-]*\\', value):\\n                raise RuntimeError(\\'Resource absence inventory invalid\\')\\n            observed.append(value)\\n        if expected & set(observed):\\n            raise RuntimeError(\\'Exact container or volume still present before firewall cleanup\\')\\n\\n\\ndef cleanup_network(root, command=runner_command):\\n    directory = Path(root) / STATE_DIRECTORY\\n    path = directory / STATE_NAME\\n    if directory.is_symlink():\\n        raise RuntimeError(\\'Invalid firewall recovery directory\\')\\n    if not path.exists() and not path.is_symlink():\\n        # Install journals intent before its first mutation. No journal means no\\n        # install began, or earlier positive cleanup completed and removed it.\\n        return\\n    plan = read_plan(directory)\\n    confirm_resources_absent(root, command)\\n    Lease(directory, plan, command).cleanup()\\n\\n\\nif __name__ == \\'__main__\\':\\n    try:\\n        cleanup_network(Path(__file__).resolve().parent)\\n    except BaseException:\\n        raise SystemExit(\\'FAIL: network_cleanup_unverified; discard dedicated runner\\')\\n    print(\\'CHECK: exact network cleanup verified\\', flush=True)\\n')\n(root / 'isolated_diagnostic.py').write_text('\"\"\"Source/Secret-free approved firewall diagnostic; fixed public output only.\"\"\"\\nimport os\\nfrom pathlib import Path\\nimport signal\\n\\nfrom cleanup_network import prepare_network, cleanup_network\\nfrom cleanup_probe import cleanup_probe\\nfrom network_gate import gate, prepare_probe_image\\n\\n\\nFAILURE_CODES = {\\n    \\'Unsupported firewall backend\\': \\'firewall_backend_unsupported\\',\\n    \\'Mixed firewall backends\\': \\'firewall_backends_mixed\\',\\n    \\'Bridge netfilter is not enabled\\': \\'bridge_netfilter_disabled\\',\\n    \\'Native nft objects are unsupported\\': \\'native_nft_objects_unsupported\\',\\n    \\'Unsupported native nft base chain\\': \\'native_nft_hook_unsupported\\',\\n    \\'Unsupported nft rule statement\\': \\'nft_statement_unsupported\\',\\n    \\'Unsupported xt extension\\': \\'xt_extension_unsupported\\',\\n    \\'Unsupported traffic control network path\\': \\'traffic_control_unsupported\\',\\n    \\'Unsupported XDP network path\\': \\'xdp_path_unsupported\\',\\n    \\'Unexpected bridge peers\\': \\'bridge_peers_unexpected\\',\\n    \\'Unsupported bridge scope\\': \\'bridge_scope_unsupported\\',\\n    \\'Unaccounted bridge interfaces\\': \\'bridge_interfaces_unaccounted\\',\\n    \\'Network isolation evidence invalid\\': \\'network_evidence_invalid\\',\\n    \\'Network isolation operation failed\\': \\'network_operation_failed\\',\\n    \\'Network inventory changed\\': \\'network_inventory_changed\\',\\n    \\'Owned firewall anchor hook invalid\\': \\'firewall_anchor_invalid\\',\\n    \\'Owned firewall anchor hook missing\\': \\'firewall_anchor_missing\\',\\n    \\'Owned firewall policy changed\\': \\'firewall_policy_changed\\',\\n    \\'Firewall hook precedence changed\\': \\'firewall_precedence_changed\\',\\n    \\'Actual namespace IPv6 is not disabled\\': \\'actual_ipv6_not_disabled\\',\\n    \\'Actual container identity unverified\\': \\'container_identity_unverified\\',\\n    \\'Actual container DNS does not match firewall\\': \\'container_dns_mismatch\\',\\n    \\'Exact diagnostic cleanup unverified\\': \\'diagnostic_cleanup_unverified\\',\\n    \\'Cancelled\\': \\'cancelled\\',\\n}\\n\\n\\ndef report_failure(error):\\n    print(\\'FAIL: isolated_diagnostic_reason=\\' +\\n          FAILURE_CODES.get(str(error), \\'unclassified_operation_failure\\'), flush=True)\\n\\n\\ndef cancelled(signum, frame):\\n    raise RuntimeError(\\'Cancelled\\')\\n\\n\\ndef main(root=None):\\n    root = Path(root) if root is not None else Path(__file__).resolve().parent\\n    if any(name.startswith(\\'ANDROID_KEY\\') for name in os.environ):\\n        raise RuntimeError(\\'Signing credentials must not enter isolated diagnostic\\')\\n    os.umask(0o077)\\n    prior = {number: signal.signal(number, cancelled) for number in (signal.SIGTERM, signal.SIGINT)}\\n    try:\\n        try:\\n            print(\\'CHECK: trusted probe image preparation started\\', flush=True)\\n            prepare_probe_image()\\n            print(\\'CHECK: scoped network inventory validation started\\', flush=True)\\n            lease = prepare_network(root)\\n            print(\\'CHECK: exact scoped IPv4 policy installation started\\', flush=True)\\n            lease.install()\\n            print(\\'CHECK: scoped IPv4 policy installation verified; fresh probe started\\', flush=True)\\n            if gate(root, lease) is not True:\\n                raise RuntimeError(\\'Actual IPv6 namespace proof missing\\')\\n        except BaseException as error:\\n            report_failure(error)\\n            ra