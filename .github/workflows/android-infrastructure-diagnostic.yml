# Source-free, secret-free infrastructure diagnostic. No SDK installer, firewall changes or signing.
name: Source-free Android infrastructure diagnostic
'on':
  push:
    branches: [mobile-dev]
    paths: [.github/workflows/android-infrastructure-diagnostic.yml]
  workflow_dispatch: {}
permissions: {}
jobs:
  diagnose:
    if: ${{ github.repository_id == '1451291617' && github.ref == 'refs/heads/mobile-dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Observe infrastructure exposure without source or credentials
        shell: bash
        run: "python3 - <<'PYTRUSTED'\nimport os\nfrom pathlib import Path\nos.umask(0o077)\nroot = Path(os.environ['RUNNER_TEMP']) / 'jfm-infra-probe'\nroot.mkdir(mode=0o700, exist_ok=False)\n(root / 'network_gate.py').write_text('\"\"\"Trusted source/secret-free observations, NOT a durable network isolation proof.\\nOnly fixed success/failure messages leave this process; inventory values stay private.\\n\"\"\"\\nimport ipaddress\\nimport json\\nfrom pathlib import Path\\nimport re\\nimport subprocess\\nimport uuid\\nimport signal\\nfrom cleanup import remove_and_verify\\nfrom namespace_state import REPORT_SCRIPT, external_ipv6_disabled\\n\\nBASE_IMAGE = \\'ubuntu:24.04@sha256:78d4744ead1f5b19b04d0df558ab182a5300903900755e515b2ca4d10eb2044d\\'\\nMETADATA = [(\\'169.254.169.254\\', 80), (\\'fd00:ec2::254\\', 80), (\\'168.63.129.16\\', 80), (\\'168.63.129.16\\', 32526)]\\nDEPENDENCIES = [(\\'github.com\\', 443), (\\'registry.npmjs.org\\', 443), (\\'dl.google.com\\', 443), (\\'repo.maven.apache.org\\', 443), (\\'services.gradle.org\\', 443)]\\nMAX_LISTENERS = 128\\nMAX_TARGETS = 512\\n\\n\\ndef run(args, timeout=20):\\n    result = subprocess.run(args, capture_output=True, text=True, timeout=timeout)\\n    if result.returncode:\\n        raise RuntimeError(\\'Infrastructure operation failed; inventory suppressed\\')\\n    return result.stdout\\n\\n\\ndef parse_inventory(interfaces, listeners, network, ipv6_disabled=False):\\n    if not isinstance(interfaces, list) or not interfaces or not isinstance(network, list) or len(network) != 1:\\n        raise ValueError(\\'Incomplete network inventory\\')\\n    addresses = set()\\n    families = set()\\n    for interface in interfaces:\\n        if not isinstance(interface.get(\\'ifname\\'), str) or not isinstance(interface.get(\\'addr_info\\'), list):\\n            raise ValueError(\\'Malformed interface inventory\\')\\n        for item in interface[\\'addr_info\\']:\\n            if item.get(\\'family\\') not in (\\'inet\\', \\'inet6\\'):\\n                raise ValueError(\\'Unknown address family\\')\\n            value = ipaddress.ip_address(item[\\'local\\'])\\n            families.add(value.version)\\n            if value.version == 6 and ipv6_disabled:\\n                continue\\n            if value.is_link_local:\\n                raise ValueError(\\'Host link-local scope unresolved in probe namespace\\')\\n            if not value.is_loopback and not value.is_unspecified:\\n                addresses.add(str(value))\\n    bridge = network[0]\\n    if bridge.get(\\'Name\\') != \\'bridge\\' or bridge.get(\\'Driver\\') != \\'bridge\\' or not isinstance(bridge.get(\\'Containers\\'), dict):\\n        raise ValueError(\\'Unexpected Docker network\\')\\n    if bridge[\\'Containers\\']:\\n        raise ValueError(\\'Existing bridge peers prevent complete exposure assessment\\')\\n    config = bridge.get(\\'IPAM\\', {}).get(\\'Config\\')\\n    if not isinstance(config, list) or not config:\\n        raise ValueError(\\'Missing bridge addressing\\')\\n    for item in config:\\n        if item.get(\\'Gateway\\'):\\n            gateway = ipaddress.ip_address(item[\\'Gateway\\'])\\n            if not ipv6_disabled or gateway.version == 4:\\n                addresses.add(str(gateway))\\n    if not addresses or 4 not in families or (6 not in families and not ipv6_disabled):\\n        # IPv6 loopback still establishes that IPv6 inventory was available.\\n        raise ValueError(\\'Incomplete IPv4/IPv6 inventory\\')\\n    rows = listeners.splitlines()\\n    if len(rows) > MAX_LISTENERS:\\n        raise ValueError(\\'Listener inventory exceeds reviewed bound\\')\\n    ports = set()\\n    for row in rows:\\n        fields = row.split()\\n        if len(fields) < 5 or fields[0] != \\'LISTEN\\':\\n            raise ValueError(\\'Malformed listener inventory\\')\\n        local = fields[3]\\n        host, separator, port = local.rpartition(\\':\\')\\n        if not separator or not port.isdecimal() or not 1 <= int(port) <= 65535:\\n            raise ValueError(\\'Malformed listener endpoint\\')\\n        host = host.strip(\\'[]\\').split(\\'%\\')[0]\\n        if host != \\'*\\':\\n            ipaddress.ip_address(host)\\n        ports.add(int(port))\\n    targets = {(host, port) for host in addresses for port in ports}\\n    targets.update((host, port) for host, port in METADATA if not ipv6_disabled or ipaddress.ip_address(host).version == 4)\\n    if len(targets) > MAX_TARGETS:\\n        raise ValueError(\\'Probe inventory exceeds reviewed bound\\')\\n    return sorted(targets)\\n\\n\\ndef security_args(cid):\\n    return [\\'--name\\', cid, \\'--user=10001:10001\\', \\'--read-only\\', \\'--cap-drop=ALL\\',\\n            \\'--security-opt=no-new-privileges:true\\', \\'--pids-limit=768\\', \\'--memory=10g\\',\\n            \\'--cpus=2\\', \\'--ulimit=nofile=65536:65536\\', \\'--network=bridge\\', \\'--log-driver=none\\',\\n            \\'--ipc=private\\', \\'--cgroupns=private\\',\\n            \\'--tmpfs=/tmp:rw,nosuid,nodev,size=2g,uid=10001,gid=10001\\',\\n            \\'--mount=type=volume,source=\\'+cid+\\'-work,destination=/work\\',\\n            \\'--mount=type=volume,source=\\'+cid+\\'-sdk,destination=/opt/android-sdk\\']\\n\\n\\ndef connect(cid, host, port):\\n    # Inputs are fixed dependency names or ipaddress-validated inventory; not shell fragments.\\n    if not re.fullmatch(r\\'[A-Za-z0-9.:_-]+\\', host) or not 1 <= port <= 65535:\\n        raise ValueError(\\'Invalid probe target\\')\\n    result = subprocess.run([\\'docker\\', \\'exec\\', cid, \\'/usr/bin/timeout\\', \\'2\\', \\'/bin/bash\\', \\'-c\\',\\n                             \\'exec 3<>/dev/tcp/\"$1\"/\"$2\"\\', \\'probe\\', host, str(port)],\\n                            capture_output=True, timeout=5)\\n    if result.returncode == 0:\\n        return True\\n    # Bash connect error or timeout is negative observation, never proof of isolation.\\n    if result.returncode not in (1, 124):\\n        raise RuntimeError(\\'Probe infrastructure failed\\')\\n    return False\\n\\n\\ndef normalized_interfaces(interfaces):\\n    return sorted((item[\\'ifname\\'], address[\\'family\\'], address[\\'local\\'])\\n                  for item in interfaces for address in item[\\'addr_info\\'])\\n\\n\\ndef inventory_unchanged(before_interfaces, before_listeners, after_interfaces, after_listeners):\\n    return (normalized_interfaces(before_interfaces) == normalized_interfaces(after_interfaces)\\n            and sorted(before_listeners.splitlines()) == sorted(after_listeners.splitlines()))\\n\\n\\ndef inspect_namespace(cid):\\n    return external_ipv6_disabled(run([\\'docker\\', \\'exec\\', cid, \\'/bin/bash\\', \\'-c\\', REPORT_SCRIPT]))\\n\\n\\ndef gate(root):\\n    signal.signal(signal.SIGTERM, lambda signum, frame: (_ for _ in ()).throw(RuntimeError(\\'Cancelled\\')))\\n    # No source or signing Secrets may be in this process\\'s environment or container.\\n    import os\\n    if any(name.startswith(\\'ANDROID_KEY\\') for name in os.environ):\\n        raise RuntimeError(\\'Signing credentials must not be present during diagnostic\\')\\n    print(\\'CHECK: host inventory started\\', flush=True)\\n    interfaces = json.loads(run([\\'ip\\', \\'-j\\', \\'address\\', \\'show\\']))\\n    listeners = run([\\'ss\\', \\'-H\\', \\'-ltn\\'])\\n    network = json.loads(run([\\'docker\\', \\'network\\', \\'inspect\\', \\'bridge\\']))\\n    # Classify the actual probe namespace before interpreting host link-local IPv6.\\n    if not isinstance(network, list) or len(network) != 1 or network[0].get(\"Containers\") != {}:\\n        raise RuntimeError(\"Unexpected bridge peers or incomplete inventory\")\\n    cid = \\'jfm-probe-\\' + uuid.uuid4().hex\\n    (root/\\'probe.id\\').write_text(cid)\\n    print(\\'CHECK: host inventory accepted; official image pull started\\', flush=True)\\n    run([\\'docker\\', \\'pull\\', BASE_IMAGE], timeout=300)\\n    print(\\'CHECK: official image available; isolated probe creation started\\', flush=True)\\n    try:\\n        for suffix in (\\'-work\\', \\'-sdk\\'):\\n            run([\\'docker\\', \\'volume\\', \\'create\\', cid+suffix])\\n        run([\\'docker\\', \\'create\\'] + security_args(cid) + [\\'--entrypoint=/bin/bash\\', BASE_IMAGE,\\n                                                      \\'-c\\', \\'exec /usr/bin/sleep 1800\\'])\\n        run([\\'docker\\', \\'start\\', cid])\\n        print(\\'CHECK: isolated probe running; namespace inspection started\\', flush=True)\\n        disabled_v6 = inspect_namespace(cid)\\n        print(\\'CHECK: namespace accepted; target inventory validation started\\', flush=True)\\n        targets = parse_inventory(interfaces, listeners, network, ipv6_disabled=disabled_v6)\\n        print(\\'CHECK: target inventory accepted; dependency connectivity checks started\\', flush=True)\\n        # Verify probe binaries and network independently so broken tooling cannot pass.\\n        run([\\'docker\\', \\'exec\\', cid, \\'/bin/bash\\', \\'-c\\',\\n             \\'test -x /usr/bin/timeout && test -x /bin/bash && test -r /proc/net/ipv6_route\\'])\\n        if not all(connect(cid, host, port) for host, port in DEPENDENCIES):\\n            raise RuntimeError(\\'Required dependency connectivity not confirmed\\')\\n        # Do not treat an unusable IPv6 stack as evidence that IPv6 metadata is blocked.\\n        if not disabled_v6 and not connect(cid, \\'2606:4700:4700::1111\\', 443):\\n            raise RuntimeError(\\'IPv6 connectivity unresolved; diagnostic incomplete\\')\\n        print(\\'CHECK: dependency connectivity accepted; exposure checks started\\', flush=True)\\n        for host, port in targets:\\n            if connect(cid, host, port):\\n                raise RuntimeError(\\'Metadata or unintended host listener reachable\\')\\n        print(\\'CHECK: tested exposure absent; bridge inventory recheck started\\', flush=True)\\n        # Detect bridge-peer changes during the diagnostic; own probe is the sole expected member.\\n        after = json.loads(run([\\'docker\\', \\'network\\', \\'inspect\\', \\'bridge\\']))[0][\\'Containers\\']\\n        if len(after) != 1 or next(iter(after.values())).get(\\'Name\\') != cid:\\n            raise RuntimeError(\\'Bridge inventory changed during diagnostic\\')\\n    finally:\\n        print(\\'CHECK: exact probe resource cleanup started\\', flush=True)\\n        failure = False\\n        for kind, value in [(\\'container\\', cid), (\\'volume\\', cid+\\'-work\\'), (\\'volume\\', cid+\\'-sdk\\')]:\\n            try:\\n                remove_and_verify(kind, value)\\n            except Exception:\\n                failure = True\\n        if failure:\\n            raise RuntimeError(\\'Diagnostic cleanup not verified\\')\\n    print(\\'CHECK: probe resource cleanup verified; final inventory comparison started\\', flush=True)\\n    # Compare only AFTER our container/veth is removed. No arbitrary veth is ignored.\\n    if not inventory_unchanged(interfaces, listeners, json.loads(run([\\'ip\\', \\'-j\\', \\'address\\', \\'show\\'])), run([\\'ss\\', \\'-H\\', \\'-ltn\\'])):\\n        raise RuntimeError(\\'Host inventory changed after own probe removal\\')\\n    if json.loads(run([\\'docker\\', \\'network\\', \\'inspect\\', \\'bridge\\']))[0][\\'Containers\\'] != {}:\\n        raise RuntimeError(\\'Bridge peers changed after cleanup\\')\\n    # Fixed observation only. No signing enablement, token, environment output or public inventory.\\n    print(\\'PASS: no tested exposure observed; dependency TCP checks and cleanup passed. This is not durable isolation.\\')\\n    return disabled_v6\\n\\n\\nif __name__ == \\'__main__\\':\\n    try:\\n        gate(Path(__file__).resolve().parent)\\n    except Exception:\\n        raise SystemExit(\\'Infrastructure diagnostic failed or incomplete; stop before source or Secrets. Details suppressed.\\')\\n')\n(root / 'cleanup.py').write_text('\"\"\"Bounded removal and absence checks for exactly this draft\\'s own resources.\"\"\"\\nfrom pathlib import Path\\nimport re\\nimport subprocess\\n\\n\\ndef remove_and_verify(kind, identifier):\\n    if kind == \\'container\\':\\n        remove = [\\'docker\\', \\'rm\\', \\'-f\\', identifier]\\n        inspect = [\\'docker\\', \\'container\\', \\'inspect\\', identifier]\\n    elif kind == \\'volume\\':\\n        remove = [\\'docker\\', \\'volume\\', \\'rm\\', identifier]\\n        inspect = [\\'docker\\', \\'volume\\', \\'inspect\\', identifier]\\n    else:\\n        remove = [\\'docker\\', \\'image\\', \\'rm\\', identifier]\\n        inspect = [\\'docker\\', \\'image\\', \\'inspect\\', identifier]\\n    # An already absent resource is fine; daemon errors are not evidence of absence.\\n    subprocess.run(remove, capture_output=True, timeout=30)\\n    result = subprocess.run(inspect, capture_output=True, timeout=15)\\n    error = result.stderr.decode(\\'utf-8\\', errors=\\'replace\\').strip()\\n    expected = {\\n        \\'container\\': [f\\'Error: No such container: {identifier}\\', f\\'Error: No such object: {identifier}\\'],\\n        \\'volume\\': [f\\'Error response from daemon: get {identifier}: no such volume\\'],\\n        \\'image\\': [f\\'Error response from daemon: No such image: {identifier}\\', f\\'Error: No such image: {identifier}\\'],\\n    }[kind]\\n    missing = error in expected and result.stdout.strip() == b\\'[]\\'\\n    if result.returncode == 0 or not missing:\\n        raise RuntimeError(\\'Resource deletion not verified\\')\\n\\n\\ndef cleanup(root, remove_image=True):\\n    resources = []\\n    identifier = root/\\'container.id\\'\\n    if identifier.exists():\\n        cid = identifier.read_text().strip()\\n        if not re.fullmatch(r\\'jfm-isolated-[a-f0-9]{32}\\', cid):\\n            raise RuntimeError(\\'Invalid cleanup identifier\\')\\n        resources.extend([(\\'container\\', cid), (\\'volume\\', cid+\\'-work\\'), (\\'volume\\', cid+\\'-sdk\\')])\\n    identifier = root/\\'image.id\\'\\n    if remove_image and identifier.exists():\\n        image = identifier.read_text().strip()\\n        if not re.fullmatch(r\\'sha256:[a-f0-9]{64}\\', image):\\n            raise RuntimeError(\\'Invalid image cleanup identifier\\')\\n        resources.append((\\'image\\', image))\\n    failures = False\\n    for kind, identifier in resources:\\n        try:\\n            remove_and_verify(kind, identifier)\\n        except (OSError, RuntimeError, subprocess.TimeoutExpired):\\n            failures = True\\n    if failures:\\n        raise RuntimeError(\\'Resource cleanup incomplete; discard dedicated runner\\')\\n\\n\\nif __name__ == \\'__main__\\':\\n    try:\\n        cleanup(Path(__file__).resolve().parent)\\n    except Exception:\\n        raise SystemExit(\\'Resource cleanup incomplete; discard dedicated runner\\')\\n')\n(root / 'cleanup_probe.py').write_text('\"\"\"Exact-own diagnostic cleanup, including cancellation fallback.\"\"\"\\nfrom pathlib import Path\\nimport re\\nfrom cleanup import remove_and_verify\\n\\n\\ndef cleanup_probe(root):\\n    path = root/\\'probe.id\\'\\n    if not path.exists():\\n        return\\n    cid = path.read_text().strip()\\n    if not re.fullmatch(r\\'jfm-probe-[a-f0-9]{32}\\', cid):\\n        raise RuntimeError(\\'Invalid probe cleanup identifier\\')\\n    failed = False\\n    for kind, value in [(\\'container\\', cid), (\\'volume\\', cid+\\'-work\\'), (\\'volume\\', cid+\\'-sdk\\')]:\\n        try:\\n            remove_and_verify(kind, value)\\n        except Exception:\\n            failed = True\\n    if failed:\\n        raise RuntimeError(\\'Diagnostic cleanup not verified; discard dedicated runner\\')\\n\\n\\nif __name__ == \\'__main__\\':\\n    try:\\n        cleanup_probe(Path(__file__).resolve().parent)\\n    except Exception:\\n        raise SystemExit(\\'Diagnostic cleanup not verified; discard dedicated runner\\')\\n')\n(root / 'namespace_state.py').write_text('\"\"\"Read-only namespace evidence. conf/all is deliberately not used as aggregate proof.\"\"\"\\nimport re\\n\\nREPORT_SCRIPT = r\\'\\'\\'\\nprintf \\'UID:%s\\\\n\\' \"$(id -u)\"\\nwhile read -r key value rest; do\\n case \"$key\" in CapPrm:) printf \\'PRM:%s\\\\n\\' \"$value\";; CapBnd:) printf \\'BND:%s\\\\n\\' \"$value\";; CapEff:) printf \\'CAP:%s\\\\n\\' \"$value\";; NoNewPrivs:) printf \\'NNP:%s\\\\n\\' \"$value\";; esac\\ndone < /proc/self/status\\nwritable=0; test ! -w /proc/sys/net/ipv6/conf/default/disable_ipv6 || writable=1\\nprintf \\'DEFAULT_WRITABLE:%s\\\\n\\' \"$writable\"\\nprintf \\'DEFAULT:%s\\\\n\\' \"$(cat /proc/sys/net/ipv6/conf/default/disable_ipv6)\"\\nfor interface in /sys/class/net/*; do\\n name=\"${interface##*/}\"\\n setting=\"/proc/sys/net/ipv6/conf/$name/disable_ipv6\"\\n writable=0; test ! -w \"$setting\" || writable=1\\n printf \\'I:%s:%s:%s\\\\n\\' \"$name\" \"$(cat \"$setting\")\" \"$writable\"\\ndone\\nwhile IFS= read -r line; do printf \\'A:%s\\\\n\\' \"$line\"; done < /proc/net/if_inet6\\nwhile IFS= read -r line; do printf \\'R:%s\\\\n\\' \"$line\"; done < /proc/net/ipv6_route\\n\\'\\'\\'\\n\\n\\ndef external_ipv6_disabled(report):\\n    rows = report.splitlines()\\n    fixed = {}\\n    interfaces = {}\\n    addresses = []\\n    routes = []\\n    for row in rows:\\n        key, sep, value = row.partition(\\':\\')\\n        if not sep:\\n            raise ValueError(\\'Malformed namespace evidence\\')\\n        if key in (\\'UID\\', \\'CAP\\', \\'PRM\\', \\'BND\\', \\'NNP\\', \\'DEFAULT\\', \\'DEFAULT_WRITABLE\\'):\\n            if key in fixed: raise ValueError(\\'Duplicate evidence\\')\\n            fixed[key] = value\\n        elif key == \\'I\\':\\n            parts = value.split(\\':\\')\\n            if len(parts) != 3 or not re.fullmatch(r\\'[a-zA-Z0-9_.-]+\\', parts[0]) or parts[1] not in (\\'0\\', \\'1\\') or parts[2] not in (\\'0\\', \\'1\\') or parts[0] in interfaces:\\n                raise ValueError(\\'Malformed interface evidence\\')\\n            interfaces[parts[0]] = parts[1:]\\n        elif key == \\'A\\': addresses.append(value.split())\\n        elif key == \\'R\\': routes.append(value.split())\\n        else: raise ValueError(\\'Unknown namespace evidence\\')\\n    if set(fixed) != {\\'UID\\', \\'CAP\\', \\'PRM\\', \\'BND\\', \\'NNP\\', \\'DEFAULT\\', \\'DEFAULT_WRITABLE\\'} or fixed[\\'UID\\'] != \\'10001\\' or any(fixed[k] != \\'0000000000000000\\' for k in (\\'CAP\\', \\'PRM\\', \\'BND\\')) or fixed[\\'DEFAULT_WRITABLE\\'] != \\'0\\' or fixed[\\'NNP\\'] != \\'1\\':\\n        raise ValueError(\\'Required unprivileged state absent\\')\\n    if fixed[\\'DEFAULT\\'] not in (\\'0\\', \\'1\\') or not interfaces or \\'lo\\' not in interfaces:\\n        raise ValueError(\\'Incomplete interface evidence\\')\\n    for fields in addresses:\\n        if len(fields) != 6 or not re.fullmatch(\\'[0-9a-f]{32}\\', fields[0]) or fields[5] not in interfaces:\\n            raise ValueError(\\'Malformed IPv6 address\\')\\n    for fields in routes:\\n        if len(fields) != 10 or fields[9] not in interfaces or not all(re.fullmatch(\\'[0-9a-f]+\\', x) for x in fields[:9]):\\n            raise ValueError(\\'Malformed IPv6 route\\')\\n    external = {name: state for name, state in interfaces.items() if name != \\'lo\\'}\\n    if not external or any(state[1] != \\'0\\' for state in interfaces.values()):\\n        raise ValueError(\\'Incomplete or mutable namespace state\\')\\n    # IPv6 loopback addresses/routes do not provide external connectivity.\\n    return (fixed[\\'DEFAULT\\'] == \\'1\\' and all(state[0] == \\'1\\' for state in external.values())\\n            and all(fields[5] == \\'lo\\' and fields[0] == \\'0\\'*31+\\'1\\' for fields in addresses)\\n            and all(fields[9] == \\'lo\\' for fields in routes))\\n')\nPYTRUSTED\npython3 \"$RUNNER_TEMP/jfm-infra-probe/network_gate.py\"\n"
      - name: Verify exact diagnostic resource cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          cleanup_status=0
          if [ -f "$RUNNER_TEMP/jfm-infra-probe/cleanup_probe.py" ]; then
            python3 "$RUNNER_TEMP/jfm-infra-probe/cleanup_probe.py" || cleanup_status=$?
          fi
          rm -rf -- "$RUNNER_TEMP/jfm-infra-probe"
          exit "$cleanup_status"
