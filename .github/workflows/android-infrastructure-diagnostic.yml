               (\\'FORWARD\\', (\\'-o\\', self.scope.bridge) + comment + (\\'-j\\', reply))]\\n\\n    def require_policy(self, snapshot):\\n        rules = parse_filter(snapshot)\\n        for name, desired in self.policies.items():\\n            require(rules.get(name) == desired, \\'Owned firewall policy changed\\')\\n        for base in (\\'INPUT\\', \\'FORWARD\\'):\\n            hooks = [rule for chain, rule in self.hooks if chain == base]\\n            require(rules[base][:len(hooks)] == hooks, \\'Firewall hook precedence changed\\')\\n        self.require_owned_shape(rules, complete=True)\\n\\n    def require_owned_shape(self, rules, complete=False):\\n        # A killed install/cleanup may leave only a PREFIX of appended rules.\\n        # Never flush even an owned chain: unexpected contents stop cleanup.\\n        for name, desired in self.policies.items():\\n            actual = rules.get(name, [])\\n            require(actual == desired[:len(actual)] and (not complete or name in rules),\\n                    \\'Unexpected contents in owned firewall chain\\')\\n        seen = []\\n        for chain, chain_rules in rules.items():\\n            for rule in chain_rules:\\n                if any(rule[i] in (\\'-j\\', \\'-g\\') and rule[i + 1] in self.names for i in range(len(rule) - 1)):\\n                    require((chain, rule) in self.hooks, \\'Foreign reference to owned firewall chain\\')\\n                    seen.append((chain, rule))\\n        require(len(seen) == len(set(seen)), \\'Duplicate owned firewall hook\\')\\n        if complete:\\n            require(set(seen) == set(self.hooks), \\'Missing owned firewall hook\\')\\n\\n\\ndef read_plan(root):\\n    path = Path(root) / STATE_NAME\\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)\\n    try:\\n        status = os.fstat(fd)\\n        require(stat.S_ISREG(status.st_mode) and status.st_nlink == 1\\n                and status.st_uid == os.geteuid() and stat.S_IMODE(status.st_mode) == 0o600\\n                and status.st_size <= 16384, \\'Invalid firewall recovery journal\\')\\n        with os.fdopen(fd, \\'r\\', closefd=False) as handle:\\n            state = json.load(handle)\\n    finally:\\n        os.close(fd)\\n    require(set(state) == {\\'version\\', \\'token\\', \\'scope\\'} and state[\\'version\\'] == 1)\\n    data = state[\\'scope\\']\\n    data[\\'host_ipv4\\'] = tuple(data[\\'host_ipv4\\'])\\n    data[\\'dns\\'] = tuple(data[\\'dns\\'])\\n    return Plan(Scope(**data), state[\\'token\\']).validate()\\n\\n\\nclass Lease:\\n    \"\"\"Not a permission grant. Use only after concrete firewall-change approval.\\n\\n    stop/remove all exact-owned containers BEFORE cleanup. Keep the same UID for\\n    recovery journal ownership checks (normal runner Python, privileged command\\n    adapter, rather than changing Python\\'s UID between workflow steps).\\n    \"\"\"\\n    def __init__(self, root, plan, command=run):\\n        self.root, self.plan, self.command = Path(root), plan.validate(), command\\n\\n    def ipt(self, *args):\\n        return self.command([IPTABLES, \\'-w\\', \\'10\\', \\'-t\\', \\'filter\\', *args])\\n\\n    def snapshot(self):\\n        return self.command([SAVE, \\'-t\\', \\'filter\\'])\\n\\n    def verify(self, owned_containers=()):\\n        check_backend(self.command, require_anchors=True)\\n        require(read_scope(self.command, self.plan.scope.dns, owned_containers) == self.plan.scope,\\n                \\'Network inventory changed\\')\\n        self.plan.require_policy(self.snapshot())\\n\\n    def install(self):\\n        check_backend(self.command)\\n        require(read_scope(self.command, self.plan.scope.dns) == self.plan.scope, \\'Network inventory changed\\')\\n        initial = parse_filter(self.snapshot())\\n        require(not set(self.plan.names) & set(initial), \\'Firewall ownership collision\\')\\n        # Durable intent precedes the first mutation, enabling exact recovery after\\n        # SIGTERM/SIGKILL. Directory must be trusted, private, and not container-mounted.\\n        require(self.root.is_dir() and not self.root.is_symlink())\\n        status = self.root.stat()\\n        require(status.st_uid == os.geteuid() and stat.S_IMODE(status.st_mode) == 0o700,\\n                \\'Firewall recovery directory must be private\\')\\n        fd = os.open(self.root / STATE_NAME, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)\\n        with os.fdopen(fd, \\'w\\') as handle:\\n            json.dump({\\'version\\': 1, \\'token\\': self.plan.token, \\'scope\\': asdict(self.plan.scope)}, handle)\\n            handle.flush()\\n            os.fsync(handle.fileno())\\n        directory = os.open(self.root, os.O_RDONLY | os.O_DIRECTORY)\\n        try:\\n            os.fsync(directory)\\n        finally:\\n            os.close(directory)\\n        for name, rules in self.plan.policies.items():\\n            self.ipt(\\'-N\\', name)\\n            for rule in rules:\\n                self.ipt(\\'-A\\', name, *rule)\\n        # Populate all terminal policies before exposing hooks. Final FORWARD order\\n        # is egress first, return traffic second. DOCKER-USER need not exist.\\n        for chain, rule in reversed(self.plan.hooks):\\n            self.ipt(\\'-I\\', chain, \\'1\\', *rule)\\n        self.verify()\\n\\n    def cleanup(self):\\n        # An unverified Docker outage is not proof of no active peers. Leave the\\n        # restrictive rules intact, report failure and discard the ephemeral VM.\\n        require(read_plan(self.root) == self.plan, \\'Firewall recovery journal changed\\')\\n        check_backend(self.command)\\n        require(read_scope(self.command, self.plan.scope.dns) == self.plan.scope,\\n                \\'Stop and remove bridge containers before firewall cleanup\\')\\n        rules = parse_filter(self.snapshot())\\n        self.plan.require_owned_shape(rules)\\n        for chain, rule in self.plan.hooks:\\n            if rule in rules[chain]:\\n