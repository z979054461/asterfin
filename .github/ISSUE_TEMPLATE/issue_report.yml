name: "🐛 Bug Report"
description: Report a problem in Asterfin
title: "[Bug]: "
labels:
  - "🐛 bug"
body:
  - type: markdown
    attributes:
      value: |
        Search this repository's existing issues before filing a report.
        Do not share server addresses, credentials, personal media, or unredacted logs and screenshots.
        For security vulnerabilities, read SECURITY.md before sharing details.
  - type: input
    id: version
    attributes:
      label: Build or commit
      description: Include the Asterfin branch and commit you tested.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Actual and expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted examples.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and OS version
      placeholder: Android or iOS version
    validations:
      required: true
  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin server version
  - type: textarea
    id: evidence
    attributes:
      label: Optional redacted logs or screenshots
      description: Remove private information before attaching anything.
