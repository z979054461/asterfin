name: "🚀 Feature Request"
description: Suggest an improvement to the Jellyfin Mobile fork
title: "[REQUEST]: "
labels:
  - "✨ enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Search this repository's existing issues before filing a request.
        Keep examples and screenshots free of private information.
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
